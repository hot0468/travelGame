// ─────────────────────────────────────────────────────────────
// 자체 점검:  index.html?test  로 열면 콘솔에 결과 출력
// ─────────────────────────────────────────────────────────────
if (location.search.includes('test')) {
  const ok = (c, m) => console[c ? 'log' : 'error'](c ? '✔' : '✘ FAIL', m);
  const R = REGIONS.busan, get = id => R.pois.find(p => p.id === id);
  const home = R.starts[0];

  // 의뢰인 편지 — 조건을 데이터에서 만들므로 의뢰를 늘리거나 수치를 바꿔도 빠지면 안 된다.
  // (렌더 구역 함수라 node selftest 에는 없다. 브라우저 ?test 에서만 돈다.)
  if (typeof letterBody === 'function') R.quests.forEach(q => {
    const t = letterBody(q).replace(/<[^>]*>/g, '');
    const miss = q.must.filter(id => !t.includes(get(id).name));
    ok(!miss.length && t.includes(won(q.budget)) && t.includes(`${q.minSights}곳`)
       && (!q.banModes || q.banModes.every(m => t.includes(TRANSPORT[m].name)))
       && (!q.endBy || t.includes(hhmm(q.endBy))), `${q.id} 편지에 조건 전부 표시`);
  });

  // 부산역→해운대 실제 약 15km / 대중교통 40~50분
  const d = km(home, get('haeundae')) * DETOUR;
  ok(d > 12 && d < 20, `부산역→해운대 ${d.toFixed(1)}km (12~20 기대)`);
  const tr = travel(home, get('haeundae'), 'bus', 2);
  ok(tr.min > 35 && tr.min < 70, `대중교통 ${tr.min}분 (35~70 기대)`);
  ok(travel(home, get('haeundae'), 'taxi', 2).min < tr.min, '택시가 대중교통보다 빠름');
  ok(travel(home, get('haeundae'), 'taxi', 2).cost > tr.cost, '택시가 대중교통보다 비쌈');

  // 도착 교통편이 시작지점을 정한다 (서울: KTX→부산역, 항공→김해공항)
  const base = { region: 'busan', quest: R.quests[0], plan: [{ id: 'haeundae', mode: 'bus', stay: 90 }] };
  const byKtx = compute({ ...base, arriveId: 'ktx' }), byAir = compute({ ...base, arriveId: 'air' });
  ok(startPoint({ region: 'busan', quest: R.quests[0], arriveId: 'ktx' }).id === 'busanstn', 'KTX 는 부산역 도착');
  ok(startPoint({ region: 'busan', quest: R.quests[0], arriveId: 'air' }).id === 'gimhae', '항공은 김해공항 도착');
  ok(byAir.moveMin > byKtx.moveMin, `도착지 반영: 부산역 ${byKtx.moveMin}분 < 김해공항 ${byAir.moveMin}분`);

  // 지하철은 버스보다 빠르고, 출퇴근 정체의 영향을 받지 않는다
  const busLeg = travel(home, get('haeundae'), 'bus', 2, 600);
  const subLeg = travel(home, get('haeundae'), 'subway', 2, 600);
  ok(subLeg.min < busLeg.min, `지하철이 버스보다 빠름 (${subLeg.min}분 < ${busLeg.min}분)`);
  const busRush = travel(home, get('haeundae'), 'bus', 2, 480);      // 08:00 출발
  const busFree = travel(home, get('haeundae'), 'bus', 2, 840);      // 14:00 출발
  ok(busRush.min > busFree.min, `출퇴근 시간 버스 지연 (${busFree.min}분 → ${busRush.min}분)`);
  ok(travel(home, get('haeundae'), 'taxi', 2, 480).min > travel(home, get('haeundae'), 'taxi', 2, 840).min, '택시도 정체 영향');
  ok(travel(home, get('haeundae'), 'subway', 2, 480).min === travel(home, get('haeundae'), 'subway', 2, 840).min, '지하철은 정체 영향 없음');
  // 정체는 주행 구간만 늘린다 — 도보·대기는 길이 막혀도 그대로다
  const fx = TRANSPORT.bus.walk + TRANSPORT.bus.wait;
  const rr = (busRush.min - fx) / (busFree.base - fx);
  ok(Math.abs(rr - 1.5) < .02, `정체 구간 전체에 걸치면 주행분이 정확히 1.5배 (${rr.toFixed(2)})`);
  ok(busRush.min - busFree.min < busFree.base * .5, '도보·대기에는 정체 배수가 안 붙는다');

  // 카페는 식사보다 체력 회복이 적다
  const eat = compute({ region: 'busan', quest: R.quests[0], arriveId: 'ktx', plan: [{ id: 'dwaeji', mode: 'bus', stay: 60 }] });
  const sip = compute({ region: 'busan', quest: R.quests[0], arriveId: 'ktx', plan: [{ id: 'jeonpo', mode: 'bus', stay: 60 }] });
  ok(eat.rows[0].dStay < sip.rows[0].dStay, `식사가 카페보다 체력 회복 큼 (${(-eat.rows[0].dStay).toFixed(1)} vs ${(-sip.rows[0].dStay).toFixed(1)})`);

  // 초기 이동비가 경비에 포함된다 (서울 KTX 59,800 × 2인)
  ok(byKtx.spend >= 119600, `초기 이동비 포함 (총 ${won(byKtx.spend)})`);
  const byBus = compute({ ...base, arriveId: 'bus' });
  ok(byBus.spend < byKtx.spend, '고속버스가 KTX 보다 쌈');
  ok(byBus.rows[0].begin > byKtx.rows[0].begin, '싼 교통편은 늦게 도착해 일정이 늦게 시작');

  // 자차로 오면 여행 중 렌터카 대여료가 붙지 않는다
  const carPlan = { region: 'busan', quest: R.quests[0], plan: [{ id: 'haeundae', mode: 'car', stay: 90 }] };
  const own = compute({ ...carPlan, arriveId: 'car' }), rent = compute({ ...carPlan, arriveId: 'ktx' });
  ok(rent.spend - own.spend > 0 && !own.bad.some(m => m.includes('렌터카')), '자차 도착 시 렌터카 일 대여료 면제');

  // ── 도시간 교통편 예매 ──────────────────────────────────
  const ktx = R.origins['서울'].find(o => o.id === 'ktx');
  const ktxT = tripsOf(R, ktx);
  ok(SLOTS.length === 4, `예매 시간대 4개 (${SLOTS.map(s => s.name).join('·')})`);
  // 저녁이 가장 싸고 오후·오전·새벽 순으로 비싸진다
  const fares = SLOTS.map(s => fareOf(R, ktx, s.dep[0]));
  ok(fares[0] > fares[1] && fares[1] > fares[2] && fares[2] > fares[3],
     `요금 새벽>오전>오후>저녁 (${fares.map(won).join(' > ')})`);
  ok(ktxT.every(t => t.arrive <= LAST_ARRIVE), '자정 가까이 닿는 편은 팔지 않는다');
  const busT = tripsOf(R, R.origins['서울'].find(o => o.id === 'bus'));
  ok(busT.length < 12, `4시간 20분 걸리는 고속버스는 늦은 편이 빠진다 (${busT.length}편)`);
  // 예매하면 그 편의 출발 시각이 첫날 시작 시각이 된다
  const bookAt = dep => compute({ region: 'busan', quest: R.quests[0], arriveId: 'ktx', depMin: dep,
                                  plan: [{ id: 'haeundae', mode: 'bus', stay: 90 }] });
  const dawn = bookAt(SLOTS[0].dep[0]), eve = bookAt(SLOTS[3].dep[0]);
  ok(dawn.rows[0].begin < eve.rows[0].begin, `새벽편이 저녁편보다 일찍 시작 (${hhmm(dawn.rows[0].begin)} < ${hhmm(eve.rows[0].begin)})`);
  ok(dawn.spend > eve.spend, `새벽편이 저녁편보다 비쌈 (${won(dawn.spend)} > ${won(eve.spend)})`);
  ok(arrival({ region: 'busan', quest: R.quests[0], arriveId: 'ktx', depMin: 310 }).arrive === 310 + ktx.min,
     '도착 시각 = 출발 시각 + 소요시간');
  // 예매 전에는 데이터의 기본편 그대로 (하위호환 — 도구 스크립트는 depMin 없이 계산한다)
  ok(arrival({ region: 'busan', quest: R.quests[0], arriveId: 'ktx' }).arrive === ktx.arrive, '예매 전에는 데이터 기본편');

  // 밤배처럼 정기 시간대에 안 맞는 노선은 데이터의 deps 를 그대로 판다
  const ship = R.origins['제주'].find(o => o.id === 'ship'), shipT = tripsOf(R, ship);
  ok(shipT.length === ship.deps.length && shipT[0].dep === ship.deps[0].dep, `여객선은 적어 둔 편만 (${shipT.length}편)`);
  ok(shipT[0].fare === ship.deps[0].fare, '적어 둔 편은 시간대 배수 없이 그 요금 그대로');
  ok(hhmm(-210) === '20:30', `전날 출발도 시각으로 읽힌다 (${hhmm(-210)})`);
  ok(arrival({ region: 'busan', quest: R.quests[4], arriveId: 'ship', depMin: -210 }).min === 690,
     '밤배는 편마다 적힌 소요시간을 쓴다');

  // 자차: 유류비 + 고속도로 통행료. 0~5시 출발이면 통행료 심야할인.
  const car = R.origins['서울'].find(o => o.id === 'car');
  const cb = carBill(R, car, 600), cbn = carBill(R, car, 240);
  ok(cb.fuel === Math.round(car.km / R.fuel.kmpl * R.fuel.price / 100) * 100, `유류비 ${won(cb.fuel)} (${car.km}km)`);
  ok(cb.toll === car.toll, `통행료 ${won(cb.toll)}`);
  ok(cbn.night && cbn.toll < cb.toll, `심야 출발 통행료 할인 (${won(cb.toll)} → ${won(cbn.toll)})`);
  ok(fareOf(R, car, 600) === cb.fuel + cb.toll, '자차 비용 = 유류비 + 통행료');
  const drive = compute({ region: 'busan', quest: R.quests[0], arriveId: 'car', depMin: 600,
                          plan: [{ id: 'haeundae', mode: 'car', stay: 90 }] });
  ok(drive.bills.some(b => b.what.includes('유류비')) && drive.bills.some(b => b.what.includes('통행료')),
     '경비 내역에 유류비·통행료가 따로 잡힌다');
  ok(compute({ region: 'busan', quest: R.quests[0], arriveId: 'car', depMin: 240, plan: [] }).spend
     < compute({ region: 'busan', quest: R.quests[0], arriveId: 'car', depMin: 600, plan: [] }).spend,
     '심야 출발이 통행료만큼 싸다');

  // 영업시간 위반 감지: 감천문화마을(~18:00 마감)에 23시 도착하도록 출발을 늦춤
  const late = compute({ region: 'busan', quest: R.quests[1], plan: [{ id: 'jagalchi', mode: 'bus', stay: 700 }, { id: 'gamcheon', mode: 'bus', stay: 120 }] });
  ok(late.bad.some(m => m.includes('영업')), '영업시간 위반 감지');

  // 숙소를 지나면 다음날로 넘어감
  const two = compute({
    region: 'busan', quest: R.quests[0], startMin: 540,
    plan: [{ id: 'haeundae', mode: 'bus', stay: 90 }, { id: 'gh_nampo', mode: 'bus', stay: 0 }, { id: 'jagalchi', mode: 'bus', stay: 60 }]
  });
  ok(two.rows[2].day === 1, `숙소 이후 2일차로 전환 (day=${two.rows[2].day})`);
  ok(two.rows[2].begin >= 1440 + 540, '2일차는 아침 출발 시각부터 시작');

  // 관광지 수 미달 감지 (haeundae, jagalchi 2곳 < minSights 3)
  ok(two.warn.some(m => m.includes('관광지')), '관광지 수 미달 감지 (warn — 제출은 된다)');
  // 필수코스 누락 감지 (q1 필수는 해운대인데 안 넣음)
  const miss = compute({ region: 'busan', quest: R.quests[0], startMin: 540, plan: [{ id: 'jagalchi', mode: 'bus', stay: 60 }] });
  ok(miss.warn.some(m => m.includes('필수 코스 누락')), '필수코스 누락 감지 (warn — 제출은 된다)');

  // 예산 초과 감지
  const rich = compute({
    region: 'busan', quest: R.quests[2], startMin: 540,
    plan: [{ id: 'yongkungsa', mode: 'taxi', stay: 90 }, { id: 'galbi', mode: 'taxi', stay: 90 }, { id: 'xthesky', mode: 'taxi', stay: 60 }]
  });
  ok(rich.spend > 0, `비용 계산됨 ${won(rich.spend)}`);
  console.log('자체 점검 끝');
}
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여행설계사 · 부산</title>
<style>
  :root{
    --bg:#fff6e3; --panel:#ffffff; --panel2:#fdf1da; --line:#efe2c8;
    --ink:#3b3261;                                /* 스티커 외곽선·글자 */
    --fg:#3b3261; --dim:#8f87ad;
    --acc:#ff6f9c; --acc-d:#e0517e;               /* 딸기 핑크 */
    --ok:#2ec98b; --ok-d:#1fa06c;
    --warn:#ffb02e; --warn-d:#d98d13;
    --bad:#ff6464; --bad-d:#d94848;
    --sight:#4d9aff; --food:#ff9a3d; --stay:#b06cff;
    --glass:rgba(255,255,255,.96);
    --sel:#ffeaf1;
    --hard:3px 3px 0 rgba(59,50,97,.16);          /* 스티커 그림자 */
    --hard-lift:5px 6px 0 rgba(59,50,97,.18);
    --sh:0 6px 18px rgba(59,50,97,.10);
    --sh-lift:0 10px 24px rgba(59,50,97,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 "Pretendard","Malgun Gothic",system-ui,sans-serif;
       background:radial-gradient(rgba(255,178,46,.10) 2.2px,transparent 2.6px) 0 0/26px 26px,
                  radial-gradient(rgba(255,111,156,.08) 2.2px,transparent 2.6px) 13px 13px/26px 26px,
                  linear-gradient(180deg,#fff9ec,var(--bg));color:var(--fg);height:100vh;overflow:hidden}
  header{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 16px;
         background:rgba(255,252,244,.94);backdrop-filter:blur(12px);border-bottom:3px solid var(--ink);
         box-shadow:0 4px 0 rgba(59,50,97,.10)}
  header h1{font-size:16px;margin:0;letter-spacing:-.01em;font-weight:800;display:flex;align-items:center;gap:8px}
  header h1 .ic{width:30px;height:30px;padding:5px;box-sizing:border-box;color:#fff;background:var(--acc);
                border:2.5px solid var(--ink);border-radius:10px;transform:rotate(-8deg);
                box-shadow:2px 2px 0 rgba(59,50,97,.9)}
  .chip:has(#lv){background:linear-gradient(180deg,#ffd76b,#ffb02e);border-color:var(--ink);color:var(--ink);
                 box-shadow:2px 2px 0 rgba(59,50,97,.9);transform:rotate(2deg)}
  .grow{flex:1}
  .chip{background:var(--panel);border:2.5px solid var(--ink);border-radius:999px;padding:3px 13px;font-size:12.5px;font-weight:800;box-shadow:var(--hard)}
  .xpbar{width:120px;height:12px;background:#f3e6cb;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
  .xpbar i{display:block;height:100%;border-radius:999px;background:repeating-linear-gradient(-45deg,#ff8fb2 0 6px,#ff6f9c 6px 12px);transition:width .4s ease}
  /* 지도는 화면 전체. 좌·우 패널은 그 위에 떠 있는 반투명 레이어. */
  .panel{position:absolute;top:53px;bottom:0;z-index:15;display:flex;flex-direction:column;min-height:0;
         background:rgba(255,252,244,.94);backdrop-filter:blur(14px);box-shadow:-5px 0 0 rgba(59,50,97,.08)}
  .panel.right{right:0;width:300px;border-left:3px solid var(--ink)}
  /* 일정 정보와 편집창은 타임라인 왼쪽에 떠 있는 단독 팝업.
     패널의 자식이라 접기 애니메이션에 같이 딸려 나간다. */
  .lpops{position:absolute;right:calc(100% + 12px);top:10px;width:238px;z-index:2;
         display:flex;flex-direction:column;gap:9px;max-height:calc(100% - 20px);pointer-events:none}
  .lpop{background:var(--glass);backdrop-filter:blur(12px);border:2.5px solid var(--ink);
        border-radius:16px;box-shadow:var(--hard);pointer-events:auto;overflow:hidden;
        animation:popin .22s cubic-bezier(.34,1.56,.64,1)}
  .lpop[hidden]{display:none}
  #infopop{transform:rotate(-.7deg);overflow-y:auto}
  #editpop{transform:rotate(.6deg)}
  .lpop h2{padding:11px 13px 0;margin:0}
  .gauges{padding:10px 13px 2px}
  .gauges .stam+.stam{margin-top:9px}
  #editpop .edit{border:0;margin:0;background:transparent;padding:11px 13px}
  #stats{padding:9px 13px 12px;border-top:2px dashed #d9cdae;margin-top:9px}
  #stats .stat:last-child{margin-bottom:0}
  /* 총 경비를 누르면 펼쳐지는 지출 내역 */
  #vSpend{cursor:pointer;border-bottom:1.5px dotted var(--dim)}
  #bills{margin:6px 0 2px;border-top:1px dashed var(--line);padding-top:6px}
  #bills[hidden]{display:none}
  .bday{font-size:11px;color:var(--dim);font-weight:800;margin:5px 0 2px}
  .bday:first-child{margin-top:0}
  .brow{display:flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.75}
  .brow .bnm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brow b{font-weight:700}
  .brow.minus b{color:var(--ok)}
  /* 좌상단 HUD — 의뢰 요약과 필터만. 목록은 없애고 장소는 지도에서 직접 고른다. */
  .hud{position:absolute;top:63px;left:12px;z-index:14;width:238px;display:flex;flex-direction:column;gap:7px}
  .hud .card{margin:0;padding:11px 13px;background:var(--glass);backdrop-filter:blur(10px);cursor:default;transform:rotate(-.7deg)}
  .hud .card:hover{transform:rotate(-.7deg);box-shadow:var(--hard)}
  .hud>#warns .card{transform:rotate(.5deg)}
  .qline{font-size:13px;color:#3d4c5c;line-height:1.7;margin-top:2px}
  .hud .card:hover{border-color:var(--line)}
  .hud .tabs{padding:0;background:none;border-radius:8px}
  /* 대분류 아래 세부 타입 필터 — 이름이 길어 한 줄에 안 들어가면 접힌다 */
  #subfilters{flex-wrap:wrap;margin-top:5px}
  #subfilters[hidden]{display:none}
  #subfilters button{flex:0 1 auto;font-size:11px;padding:5px 9px;border-width:2px}
  #subfilters .ic{margin-right:2px}
  /* 구 이름을 누르면 뜨는 그 구의 장소 목록 */
  #gulist{background:var(--glass);backdrop-filter:blur(12px);border:2.5px solid var(--ink);
          border-radius:16px;overflow:hidden;box-shadow:var(--hard);animation:popin .2s cubic-bezier(.34,1.56,.64,1)}
  .guhd{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:2px solid var(--ink);background:var(--sel);font-weight:800}
  .gubody{max-height:44vh;overflow-y:auto}
  .gurow{display:flex;align-items:center;gap:7px;padding:6px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--line)}
  .gurow:hover{background:var(--sel)}
  .gurow{transition:background .1s}
  .gurow.lock{opacity:.42;cursor:not-allowed;color:var(--dim);filter:grayscale(1)}
  .gurow .fav{color:var(--ok)}
  .gnm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #map [data-gu]{cursor:pointer}
  #map [data-gu]:hover{fill:#1a7fd4}
  /* 지도 위 장소 상세 팝업 */
  #poipop{position:fixed;z-index:18;width:236px;background:var(--panel);border:3px solid var(--ink);
          border-radius:18px;padding:12px 14px;box-shadow:5px 6px 0 rgba(59,50,97,.20);
          transform-origin:50% 100%;overflow:hidden;animation:popin .26s cubic-bezier(.34,1.56,.64,1)}
  /* 장소 사진. 파일이 없으면 onerror 가 이 요소를 지우므로 빈 자리가 남지 않는다. */
  #poipop .shotwrap{position:relative;margin:-12px -14px 9px}
  #poipop .shot{display:block;width:100%;height:104px;
                object-fit:cover;border-bottom:3px solid var(--ink);
                border-radius:15px 15px 0 0;background:var(--panel2)}
  /* 사진 저작권 표시 — CC BY 계열은 저작자·라이선스를 밝히는 게 의무다 */
  #poipop .cred{position:absolute;left:0;right:0;bottom:3px;padding:1px 7px;font-size:9px;
                line-height:1.4;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.62));
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #poipop .cred a{color:#fff;text-decoration:underline}
  /* 팝업이 아래에서 튀어오르며 살짝 넘겼다 제자리로 */
  @keyframes popin{from{opacity:0;transform:scale(.7) translateY(14px)}to{opacity:1;transform:none}}
  /* 선택한 핀에서 퍼져나가는 파동 */
  @keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
  .pin.sel .ring{transform-box:fill-box;transform-origin:center;animation:ripple 1.1s ease-out infinite}
  .pin.sel .dot{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
  .pin:hover .dot{transform-box:fill-box;transform-origin:center;transform:scale(1.18);transition:transform .12s}
  /* 구 목록에서 짚은 장소 — 지도에서 찾을 수 있게 도드라지게 */
  /* 확대는 transform 으로 고정해 두고 맥박만 애니메이션 — 모션을 꺼도 눈에 띈다 */
  .pin.hi .dot{stroke:var(--ink);stroke-width:5;transform-box:fill-box;transform-origin:center;
               transform:scale(1.38);animation:hibeat .7s ease-in-out infinite alternate}
  .pin.hi{filter:drop-shadow(0 0 7px rgba(59,50,97,.55))}
  @keyframes hibeat{from{transform:scale(1.14)}to{transform:scale(1.46)}}
  #map g.hi text{font-weight:800!important}
  #map g.hi .lbl{fill:var(--ink)}
  .gurow.hi{background:var(--sel);box-shadow:inset 3px 0 0 var(--acc)}
  @media (prefers-reduced-motion:reduce){.pin.hi .dot{animation:none}}
  /* 일정에 담을 때 떠오르는 +1 */
  /* 방금 담은 구간이 이전 장소에서 뻗어 나오는 연출.
     dashoffset 은 점선 무늬 자리를 써버려 실선이 되고, 불투명 덮개는 지도까지 가린다.
     clipPath 를 늘리면 "그릴 영역" 만 자라므로 무늬도 지도도 그대로다. */
  /* 회전은 반드시 CSS 로 준다 — transform 속성은 프레젠테이션 속성이라
     애니메이션이 transform 을 잡는 순간 통째로 덮여 clip 이 선 방향을 잃는다. */
  @keyframes reveal{from{transform:rotate(var(--deg)) scaleX(0)}to{transform:rotate(var(--deg)) scaleX(1)}}
  .legclip rect{transform-box:fill-box;transform-origin:0 50%;animation:reveal .45s cubic-bezier(.4,0,.2,1) forwards}
  @media (prefers-reduced-motion:reduce){.legclip rect{animation:none;transform:rotate(var(--deg))}}
  @keyframes floatup{from{opacity:1;transform:translate(-50%,0) scale(1)}
                     to{opacity:0;transform:translate(-50%,-46px) scale(1.5)}}
  .fx{position:fixed;z-index:19;pointer-events:none;font-weight:800;font-size:17px;color:var(--ok);
      text-shadow:0 1px 3px #fff,0 0 12px #fff;animation:floatup .85s ease-out forwards}
  @media (prefers-reduced-motion:reduce){#poipop,.pin.sel .ring,.pin.sel .dot,.fx{animation:none}}
  #poipop .hd{display:flex;align-items:flex-start;gap:6px}
  #poipop h4{margin:0;font-size:14px;flex:1}
  #poipop .kv{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.6}
  #poipop button.go{margin-top:9px;padding:7px;font-size:13px}
  .panel.hide{transform:translateX(0)}
  .panel.left.hide{transform:translateX(-100%)}
  .panel.right.hide{transform:translateX(100%)}
  .panel{transition:transform .18s ease}
  .fold{position:absolute;top:50%;width:18px;height:56px;margin-top:-28px;z-index:16;cursor:pointer;
        background:var(--panel);border:2px solid var(--ink);color:var(--dim);box-shadow:2px 2px 0 rgba(59,50,97,.12);
        display:flex;align-items:center;justify-content:center;font-size:11px}
  .panel.left .fold{right:-19px;border-radius:0 6px 6px 0}
  .panel.right .fold{left:-19px;border-radius:6px 0 0 6px}
  .fold:hover{color:var(--fg)}
  .scroll{overflow-y:auto;padding:12px;flex:1}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 8px}
  /* 의뢰인의 편지 — 편지지 한 장 위에 사연, 그 아래 조건 목록 */
  .paper{background:var(--panel2);border:2.5px dashed var(--ink);border-radius:18px;
         padding:16px 18px;line-height:1.8;box-shadow:var(--hard)}
  .paper p{margin:0 0 10px}
  .paper .sign{margin:14px 0 0;text-align:right;font-weight:800}
  .need{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
  .need li{display:flex;gap:9px;align-items:flex-start;font-size:14px}
  .need li>.ic{flex:none;margin-top:2px}
  .need b{font-weight:800}
  .need .must{color:var(--acc-d)}
  .card{background:var(--panel);border:2.5px solid var(--ink);border-radius:16px;padding:11px 13px;margin-bottom:10px;
        cursor:pointer;box-shadow:var(--hard);transition:transform .12s ease,box-shadow .12s ease}
  .card:hover{transform:translateY(-2px) rotate(-.4deg);box-shadow:var(--hard-lift)}
  .card.on{background:var(--sel);box-shadow:var(--hard),0 0 0 3px rgba(255,111,156,.25)}
  .card.lock{opacity:.45;cursor:not-allowed;filter:grayscale(1)}
  .card.lock:hover{border-color:var(--line)}
  /* ── 예매 화면 (코레일·항공사 창구를 흉내낸 것) ─────────── */
  .brand{display:flex;align-items:center;gap:9px;margin:-2px 0 10px;padding:7px 12px;border-radius:12px;
         border:2.5px solid var(--ink);background:var(--panel2);box-shadow:var(--hard)}
  .brand .bnm{font-weight:800;font-size:14px;letter-spacing:-.2px}
  .brand .btag{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:2px;color:var(--dim)}
  .slotbar{display:flex;gap:5px;margin:0 0 11px}
  .slotbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
                  background:var(--panel);border:2.5px solid var(--ink);color:var(--dim);padding:6px 2px;
                  border-radius:12px;cursor:pointer;font-size:12.5px;font-weight:800;font-family:inherit;
                  box-shadow:2px 2px 0 rgba(59,50,97,.9);transition:background .12s,color .12s,transform .08s}
  .slotbar button:hover{background:var(--panel2);color:var(--fg)}
  .slotbar button.on{background:var(--acc);color:#fff;transform:rotate(-1.2deg)}
  .slotbar button .pr{font-size:10.5px;font-weight:700;opacity:.85}
  /* 편 한 줄: 편명 / 출발→도착 / 요금 */
  .trip{display:flex;align-items:center;gap:12px}
  .trip .no{flex:0 0 78px;font-size:11.5px;font-weight:800;color:var(--dim)}
  .trip .tm{font-weight:800;font-size:15px;letter-spacing:-.3px}
  .trip .tm .ar{color:var(--dim);margin:0 5px;font-weight:700}
  .trip .fare{margin-left:auto;text-align:right;font-weight:800;font-size:14px;white-space:nowrap}
  .trip .fare .u{display:block;font-size:11px;font-weight:700;color:var(--dim)}
  .cheap{color:var(--ok-d)}
  .booknote{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--dim);
            margin:2px 0 10px;line-height:1.5}
  .booknote>.ic{flex:none;margin-top:2px}
  .t{font-weight:600}
  .s{font-size:12px;color:var(--dim)}
  .tabs{display:flex;gap:4px;padding:10px 12px 0}
  .tabs button{flex:1;background:var(--panel);border:2.5px solid var(--ink);color:var(--dim);padding:6px 4px;
               border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:800;font-family:inherit;
               box-shadow:2px 2px 0 rgba(59,50,97,.9);transition:background .12s,color .12s,transform .08s,box-shadow .08s}
  .tabs button:hover{background:var(--panel2);color:var(--fg)}
  .tabs button.on{background:var(--acc);color:#fff;transform:rotate(-1.5deg)}
  .tabs button.on:active{transform:translateY(2px);box-shadow:0 0 0 rgba(59,50,97,.9)}
  /* 지형 이미지는 transform 으로 확대. 핀·글자 SVG 는 화면 좌표계 1:1 로 매번 다시 그린다.
     (SVG 를 CSS 로 확대하면 원래 해상도로 래스터화된 뒤 늘어나서 글자가 뿌옇게 된다) */
  /* touch-action:none — 지도를 끌 때 브라우저가 페이지를 스크롤·확대하지 않게 한다.
     pointer 이벤트로 팬·핀치를 직접 처리하므로 기본 동작이 있으면 서로 싸운다. */
  .mapwrap{position:absolute;inset:0;z-index:1;background:#cfdde3;overflow:hidden;cursor:grab;touch-action:none}
  .mapwrap.grabbing{cursor:grabbing}
  .mapcanvas{position:absolute;left:0;top:0;transform-origin:0 0}
  .mapcanvas img{position:absolute;left:0;top:0;display:block;user-select:none;-webkit-user-drag:none}
  #map{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #map [data-poi],#map [data-start],#map [data-gu]{pointer-events:auto}
  /* 밝은 지도 위에서도 반드시 읽히게 — 공공데이터라도 출처 표시는 빼먹으면 안 된다 */
  .maphint{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;z-index:14;max-width:60vw;
           font-size:10.5px;color:var(--dim);line-height:1.4;text-align:center;
           background:var(--glass);backdrop-filter:blur(6px);border:2px solid var(--ink);box-shadow:2px 2px 0 rgba(59,50,97,.12);
           border-radius:999px;padding:4px 14px}
  .maphint a{color:var(--acc)}
  /* 지도 조작은 상단바 중앙 — 지도 위에 떠 있으면 시야를 가린다 */
  .mapctl{display:flex;align-items:center;gap:3px;background:var(--panel);border:2.5px solid var(--ink);
          border-radius:999px;padding:3px 5px;box-shadow:2px 2px 0 rgba(59,50,97,.85)}
  .mapctl button{width:26px;height:24px;border:0;border-radius:999px;cursor:pointer;
                 background:transparent;color:var(--dim);font-size:14px;font-family:inherit;line-height:1}
  .mapctl button:hover{background:var(--line);color:var(--fg)}
  /* 레벨 옆 버프 버튼과 그 아래 팝오버 */
  #buffbtn{display:flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit;transform:rotate(-2deg)}
  #buffbtn:disabled{opacity:.45;cursor:default}
  #buffbtn .ic{color:var(--acc)}
  #buffpop{position:fixed;z-index:30;width:266px;background:var(--panel);border:3px solid var(--ink);
           border-radius:18px;padding:11px 13px;box-shadow:5px 6px 0 rgba(59,50,97,.20);
           animation:popin .22s cubic-bezier(.34,1.56,.64,1)}
  #buffpop[hidden]{display:none}
  .brow2{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
  .brow2:first-of-type{border-top:0}
  .brow2 .bic{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:28px;height:28px;
              border-radius:9px;background:#fff;border:2px solid var(--ink);color:var(--acc);
              box-shadow:2px 2px 0 rgba(59,50,97,.85);font-size:14px}
  .brow2 .bt{font-weight:800;font-size:13px}
  .brow2 .bd{font-size:11.5px;color:var(--dim);line-height:1.55;margin-top:2px}
  .buse{font-size:11px;font-weight:800;color:var(--ok);white-space:nowrap}
  .buse.gone{color:var(--dim)}
  .zoomtxt{font-size:11px;color:var(--dim);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
  /* 아이콘: 글자 크기·색을 그대로 따라가게 */
  .ic{width:1em;height:1em;flex:0 0 auto;vertical-align:-0.14em;fill:none;stroke:currentColor;
      stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ic.big{width:1.15em;height:1.15em}
  .mini.wide{width:100%;margin-top:7px;padding:4px}
  .mini{white-space:nowrap;flex:0 0 auto;background:var(--panel);border:2px solid var(--ink);color:var(--fg);
        border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;
        box-shadow:2px 2px 0 rgba(59,50,97,.85);transition:transform .07s,box-shadow .07s}
  .mini:active{transform:translate(2px,2px);box-shadow:0 0 0 rgba(59,50,97,.85)}
  .mini:hover{border-color:var(--acc);color:var(--acc)}
  .mini.danger{color:var(--bad);border-color:#e6c3c3}
  .mini.danger:hover{border-color:var(--bad);color:var(--bad);background:#fff0f0}
  /* 집에서 부산까지 오는 구간 */
  .arrive{background:repeating-linear-gradient(45deg,#dce7f5,#dce7f5 6px,#eaf1fa 6px,#eaf1fa 12px);
          border:1px solid #9fb9d8;color:#274b73;z-index:1}
  /* ── 인터랙션 연출 ─────────────────────────────── */
  /* 손님 반응 토스트 — 상단에 잠깐 떴다 사라진다 */
  /* 떠 있는 시계 — 헤더 아래 가운데. 토스트와 같은 자리라 살짝 왼쪽으로 비켜 둔다 */
  #clockpop{position:fixed;top:60px;left:50%;transform:translateX(-50%) rotate(-.5deg);z-index:13;
            background:var(--panel);border:2.5px solid var(--ink);border-radius:999px;
            padding:6px 14px;font-size:13.5px;box-shadow:var(--hard);
            font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
  #clockpop b{color:var(--acc)}
  #clockpop[hidden]{display:none}
  @media (max-width:720px){#clockpop{top:auto;bottom:calc(var(--sheet-h,92px) + 12px);left:10px;transform:none;font-size:12.5px;padding:5px 11px}}
  /* 시계 바로 아래에 쌓인다 — 같은 자리면 시계가 가려진다 */
  #toasts{position:fixed;top:102px;left:50%;transform:translateX(-50%);z-index:22;
          display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
  .toast{display:flex;align-items:center;gap:8px;padding:10px 17px;border-radius:999px;
         background:var(--panel);border:2.5px solid var(--ink);font-size:13.5px;font-weight:700;white-space:nowrap;
         box-shadow:3px 4px 0 rgba(59,50,97,.20);
         animation:toastin .28s cubic-bezier(.34,1.56,.64,1), toastout .45s ease 2.6s forwards}
  .toast .ic{color:var(--acc);flex:0 0 auto}
  .toast:nth-child(odd){transform:rotate(-1deg)}
  .toast:nth-child(even){transform:rotate(1deg)}
  .toast.fav{border-color:var(--ok)}   .toast.fav .ic{color:var(--ok)}
  .toast.tired{border-color:var(--warn)} .toast.tired .ic{color:var(--warn)}
  .toast.broke{border-color:var(--bad)}  .toast.broke .ic{color:var(--bad)}
  @keyframes toastin{from{opacity:0;transform:translateY(-12px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes toastout{to{opacity:0;transform:translateY(-10px)}}
  /* 숫자가 바뀔 때 방향을 색으로 */
  .stat b{transition:color .2s}
  .stat b.better{color:var(--ok)} .stat b.worse{color:var(--bad)}
  /* 체력바는 부드럽게, 바닥나면 경고 */
  .stam .bar i{transition:width .35s ease,background .3s}
  .stam .bar i.low{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  /* 새로 담긴 일정 블록이 밀려 들어온다 */
  .blk.new{animation:slidein .32s cubic-bezier(.34,1.56,.64,1)}
  @keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  .blk{transition:filter .12s}
  .blk:hover{filter:brightness(.96)}
  /* 제출이 가능해지는 순간 */
  button.go.ready{animation:ready 1.4s ease-in-out 2}
  @keyframes ready{0%,100%{box-shadow:0 0 0 0 #1668d600}50%{box-shadow:0 0 0 7px #1668d633}}
  .card,button.go,.mini,.gurow{transition:transform .08s}
  .card:active,button.go:active,.mini:active{transform:scale(.985)}
  @media (prefers-reduced-motion:reduce){.blk.new,button.go.ready,.stam .bar i.low{animation:none}}
  .row{display:flex;align-items:center;gap:6px}
  /* 시간 비례 타임라인: 블록 높이 = 실제 소요 분 × PPM */
  .tl{position:relative;margin:0 0 18px 50px}
  .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
  .hr b{position:absolute;left:-50px;top:-7px;width:44px;text-align:right;font:600 12px/1 inherit;color:var(--dim);font-variant-numeric:tabular-nums}
  .hr.mid{border-top-style:dotted;opacity:.5}
  .hr.mn{border-top:1px solid var(--acc);opacity:.55}          /* 자정 */
  /* 손님이 정한 귀가 마감 — 넘기면 제출이 막히므로 눈에 띄게 */
  .hr.due{border-top:2.5px dashed var(--bad)}
  .hr.due b{left:auto;right:6px;top:-16px;width:auto;text-align:right;color:var(--bad);font-weight:800;
            background:var(--panel);padding:1px 6px;border-radius:999px;border:1.5px solid var(--bad)}
  .tlhint{position:absolute;left:0;right:66px;text-align:center;font-size:12px;color:var(--dim);z-index:4}
  .blk{position:absolute;left:0;right:66px;border-radius:13px;padding:2px 8px;box-shadow:2px 2px 0 rgba(59,50,97,.10);overflow:hidden;cursor:pointer;
       font-size:11px;line-height:1.35;white-space:nowrap;text-overflow:ellipsis}
  .blk.lane{left:auto;right:0;width:60px;padding:1px 4px;font-size:10px;font-weight:600;text-align:center;border-radius:999px}  /* 이동·대기 전용 트랙 (오른쪽) */
  .blk.on{outline:2px solid var(--acc);outline-offset:1px;z-index:3}
  .blk.err{border-color:var(--bad)!important;background:#ffe1e1!important}
  .blk .nm{font-weight:600}
  /* 블록에서 바로 빼기. 글자와 겹치지 않게 오른쪽 자리를 비워 둔다 */
  .blk.hasx{padding-right:20px}
  .blk .bx{position:absolute;top:2px;right:3px;width:15px;height:15px;border-radius:50%;
           display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.75);
           color:var(--dim);opacity:.55;transition:opacity .12s,color .12s}
  .blk .bx .ic{width:11px;height:11px}
  .blk:hover .bx{opacity:1}
  .blk .bx:hover{color:var(--bad);background:#fff}
  .blk .tm{font-variant-numeric:tabular-nums;opacity:.75;font-size:10px}
  .move{background:repeating-linear-gradient(45deg,#e6ebf1,#e6ebf1 5px,#f3f6f9 5px,#f3f6f9 10px);
        border:1px solid var(--line);color:var(--dim);z-index:1}
  .move.rush{background:repeating-linear-gradient(45deg,#fbe6c9,#fbe6c9 5px,#fdf3e4 5px,#fdf3e4 10px);border-color:#d9a63a;color:#8a5a00}
  .wait{background:#fdf3dd;border:1px dashed #d9a63a;color:#8a5a00;z-index:1}
  .sight{background:#e3efff;border:2.5px solid var(--sight);color:#1c4d9e;z-index:2}
  .food{background:#fff0e0;border:2.5px solid var(--food);color:#9c4a00;z-index:2}
  .stay{background:#f3e8ff;border:2.5px solid var(--stay);color:#5f2ba8;z-index:2}
  .edit{border-top:2px dashed #d9cdae;background:var(--panel2);padding:8px 12px;font-size:12px;flex:0 0 auto}
  .edit .row{flex-wrap:wrap;row-gap:4px}
  .edit .row>*{white-space:nowrap}
  .time{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:600}
  select,input[type=number]{background:#fff;color:var(--fg);border:2px solid var(--ink);border-radius:9px;padding:2px 6px;font-size:11.5px;font-weight:700;font-family:inherit}
  input[type=number]{width:58px}
  .x{margin-left:auto;color:var(--dim);cursor:pointer;padding:0 4px;font-size:15px;line-height:1}
  .x:hover{color:var(--bad)}
  .mv{color:var(--dim);cursor:pointer;padding:0 2px;user-select:none}
  .mv:hover{color:var(--fg)}
  footer{border-top:2px dashed #d9cdae;padding:10px 12px;background:var(--panel);flex:0 0 auto}
  .stat{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
  .stat b{font-variant-numeric:tabular-nums}
  .over{color:var(--bad)}
  .msgs{margin:0;padding:0;list-style:none;font-size:12px}
  .warns{padding:8px 11px!important}
  .warns .msgs li{display:flex;gap:5px;align-items:flex-start;line-height:1.5}
  .msgs li{color:var(--bad);margin-bottom:3px}
  .msgs li.ok{color:var(--ok)}
  /* 채워진 조건은 초록으로 바뀐 뒤 접히며 사라진다 */
  @keyframes msgdone{0%{color:var(--bad)}
                     20%{color:var(--ok);opacity:1;transform:none}
                     65%{color:var(--ok);opacity:1;transform:none}
                     100%{color:var(--ok);opacity:0;transform:translateX(12px);max-height:0;margin-bottom:0}}
  .msgs li.done{color:var(--ok);overflow:hidden;max-height:3em;animation:msgdone 1.05s ease-in forwards}
  @media (prefers-reduced-motion:reduce){.msgs li.done{display:none}}
  button.go{width:100%;margin-top:9px;padding:11px;border:0;border-radius:13px;background:var(--acc);color:#fff;
            font-weight:800;font-size:14.5px;letter-spacing:-.01em;cursor:pointer;font-family:inherit;
            border:2.5px solid var(--ink);
            box-shadow:0 4px 0 var(--ink),0 7px 14px rgba(255,111,156,.30);
            transition:transform .07s ease,box-shadow .07s ease,filter .12s}
  button.go:hover{filter:brightness(1.05)}
  button.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),0 2px 6px rgba(255,111,156,.2)}
  button.go.risky{background:var(--warn)}   /* 조건을 못 채운 채 내는 제출 — 눌리긴 한다 */
  button.go.alt{background:var(--panel2);color:var(--fg);box-shadow:0 4px 0 var(--ink)}
  button.go.alt:active{box-shadow:0 1px 0 var(--ink)}
  #ask{max-width:340px;text-align:left}
  #ask .go{margin-top:0;flex:1}
  button.go:disabled{background:#f0e6d2;color:#a297bd;font-size:12px;font-weight:700;line-height:1.35;cursor:not-allowed;
                     border:2.5px solid #cbc2a9;box-shadow:0 3px 0 #cbc2a9;transform:none}
  .dayhd{font-size:11px;color:var(--dim);letter-spacing:.06em;margin:2px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .daytabs{padding:10px 10px 8px;flex:0 0 auto}
  .daytabs:empty{display:none}
  .daytabs button b{font-weight:700;opacity:.75}
  .daytabs .dw{font-size:10px;opacity:.7;margin-left:2px}
  .wakerow{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13.5px}
  .wakerow>span{white-space:nowrap;flex:0 0 auto}
  .wakerow select{flex:1 1 auto;width:100%;min-width:0;font-size:14px;padding:4px 6px}
  .sleepnote{margin-top:4px;font-size:12.5px}
  .stambar .stam .s{font-size:13px}
  .stam{margin-top:0}
  .stambar{padding:9px 10px 7px;border-bottom:2px dashed #d9cdae;flex:0 0 auto}
  .stambar:empty{display:none}
  .stam .bar{position:relative;height:14px;background:#e6d8bb;border:2px solid var(--ink);border-radius:999px;overflow:hidden;
             box-shadow:inset 0 2px 3px rgba(59,50,97,.18)}
  .stam .bar i{position:absolute;left:0;top:0;height:100%;border-radius:999px;z-index:2;
               background:linear-gradient(180deg,#3fd68f,var(--ok))}
  .stam .bar i.joy{background:linear-gradient(180deg,#ffb3cd,var(--acc))}
  .stam .bar i.joy.done{background:linear-gradient(180deg,#ffd76b,#ffb02e)}
  .stam .bar i.low{background:linear-gradient(180deg,#ffc76b,var(--warn))}
  .stam .bar i.out{background:linear-gradient(180deg,#ff8a8a,var(--bad));width:100%!important}
  .stam .s{display:block;margin-top:3px}
  dialog{background:var(--panel);color:var(--fg);border:3px solid var(--ink);border-radius:24px;padding:24px 26px;
         max-width:380px;text-align:center;box-shadow:7px 8px 0 rgba(59,50,97,.22);animation:popin .26s cubic-bezier(.34,1.56,.64,1)}
  dialog.wide{max-width:560px;width:90vw;text-align:left;max-height:86vh;overflow-y:auto}
  dialog::backdrop{background:rgba(59,50,97,.42);backdrop-filter:blur(4px)}
  /* 지역 선택 — 카드마다 지도를 옅게 깔고 이름·규모를 얹는다 */
  .regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin-top:14px}
  .rcard{position:relative;overflow:hidden;border:3px solid var(--ink);border-radius:16px;
         background:var(--panel2);padding:0;cursor:pointer;text-align:left;font-family:inherit;
         box-shadow:3px 4px 0 rgba(59,50,97,.16);transition:transform .12s}
  .rcard:hover{transform:translate(-1px,-2px);box-shadow:4px 6px 0 rgba(59,50,97,.2)}
  .rcard:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .rcard .thumb{height:78px;background:#dbe7ee center/cover no-repeat;border-bottom:2.5px solid var(--ink);
                display:flex;align-items:center;justify-content:center}
  .rcard .thumb img{width:100%;height:100%;object-fit:cover}
  .rcard .rbody{padding:8px 11px 10px}
  .rcard .rnm{font-weight:800;font-size:15px}
  .rcard .rsub{font-size:11.5px;color:var(--dim);margin-top:2px}
  .rcard.on{border-color:var(--acc);box-shadow:0 0 0 3px #ffd9e6,3px 4px 0 rgba(59,50,97,.16)}
  .rcard .soon{position:absolute;top:7px;right:7px;background:var(--dim);color:#fff;
               font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px}
  dialog h3{margin:0 0 6px;font-size:20px}
  .stars{display:flex;justify-content:center;gap:8px;margin:10px 0}
  .stars .ic{width:38px;height:38px;stroke:#c9d2dc;stroke-width:1.6;opacity:0;transform:scale(.35) rotate(-40deg);
             transition:opacity .26s,transform .34s cubic-bezier(.34,1.56,.64,1)}
  .stars .ic.in{opacity:1;transform:none}
  .stars .ic.on{fill:#f5a524;stroke:#d98c00}
  /* 결과 연출: 게이지 → 별 → 항목 → 경험치 순으로 하나씩 들어온다 */
  .rbar{position:relative;height:17px;background:#f3e6cb;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden}
  .rbar i{display:block;height:100%;width:0;border-radius:999px;transition:width .85s cubic-bezier(.22,1,.36,1)}
  .rbar i.sc{background:linear-gradient(180deg,#ffd76b,#ffb02e)}
  .rbar i.xp{background:repeating-linear-gradient(-45deg,#ff8fb2 0 6px,#ff6f9c 6px 12px)}
  .rbar u{position:absolute;top:0;bottom:0;width:2px;background:rgba(59,50,97,.3)}
  .rcap{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:5px}
  .rline{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 3px;border-bottom:1px dashed var(--line);
         opacity:0;transform:translateY(7px);transition:opacity .28s,transform .28s}
  .rline.in{opacity:1;transform:none}
  .rlv,.rbtns{opacity:0;transform:translateY(9px);transition:opacity .3s,transform .3s}
  .rlv.in,.rbtns.in{opacity:1;transform:none}
  .rlv{margin-top:9px;color:var(--acc);font-weight:800;font-size:15px}
  .ic.ok{color:var(--ok)}
  .empty{color:var(--dim);font-size:12px;text-align:center;padding:30px 10px}

  /* ── 폰 세로 ────────────────────────────────────────────────
     데스크톱은 지도 위에 좌 HUD(238)·우 패널(300)·그 옆 팝업(238)이 떠 있는 배치라
     폰 폭(390)에 셋이 못 들어간다. 지도를 바닥에 깔고 일정은 아래에서 올라오는
     시트로 바꾼다. DOM 은 그대로 두고 배치만 바꾼다. */
  @media (max-width:720px){
    /* 헤더 한 줄이 화면보다 넓어지면 body 가 함께 넓어지고, right:0 으로 붙인 것들이
       그 넓은 폭을 기준 삼아 화면 밖으로 밀린다. 그래서 헤더부터 줄인다. */
    html,body{overflow-x:hidden}
    /* 예매 한 줄은 편명·시각·요금 셋이 나란히 서야 해서 폭이 빠듯하다 */
    .trip{gap:8px}
    .trip .no{flex-basis:62px;font-size:10.5px;white-space:normal;line-height:1.25}
    .trip .tm{font-size:14px}
    .trip .fare{font-size:13px}
    .slotbar{gap:4px}
    .slotbar button{font-size:12px;padding:5px 1px}
    .slotbar button .pr{font-size:10px}
    header{gap:8px;padding:8px 10px}
    header h1{font-size:14px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .mapctl{display:none}                     /* 확대·축소는 핀치로 */
    .xpbar{width:44px;flex:0 0 auto}
    #xptxt,#regionName{display:none}

    /* 상단 요약 바: 의뢰·경고·필터를 전폭 한 덩어리로 */
    .hud{top:45px;left:0;right:0;width:auto;padding:0 8px;gap:5px}
    .hud .card{margin-bottom:0;padding:8px 11px}
    .tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tabs button{flex:0 0 auto;min-height:34px}
    /* 접힌 상태에서는 의뢰 제목과 경고 첫 줄만 — 지도를 덜 가린다 */
    body:not(.hudopen) .hud .qline,
    body:not(.hudopen) .hud #active button,
    body:not(.hudopen) .hud .msgs li:nth-child(n+2){display:none}
    body:not(.hudopen) .hud #active .t::after{content:' ▾';opacity:.5}
    body.hudopen .hud #active .t::after{content:' ▴';opacity:.5}
    #gulist{max-height:38vh}

    /* 일정 패널 → 바텀시트. --sheet 만큼 아래로 내려가 있다(0 이면 완전히 열림) */
    .panel.right{top:auto;left:0;right:0;bottom:0;width:auto;height:88vh;
      border-left:0;border-top:3px solid var(--ink);border-radius:20px 20px 0 0;
      padding-top:20px;transform:translateY(var(--sheet,60vh));
      box-shadow:0 -6px 0 rgba(59,50,97,.08)}
    .panel.right.hide{transform:translateY(var(--sheet,60vh))}   /* 접기 버튼 대신 시트 단계로 */
    /* 손잡이: 세로 탭이던 것을 시트 상단 가로 바로 */
    .panel.right .fold{top:0;left:0;right:0;width:auto;height:20px;margin:0;
      border-radius:20px 20px 0 0;display:flex;align-items:center;justify-content:center;
      touch-action:none}
    .panel.right .fold .ic{display:none}
    .panel.right .fold::before{content:'';width:44px;height:4px;border-radius:99px;background:var(--ink);opacity:.35}
    /* 데스크톱에선 패널 왼쪽에 떠 있던 게이지·편집 스트립을 시트 안으로 흘려보낸다.
       display:contents 로 껍데기를 없애 둘을 시트의 직접 자식으로 만든 뒤 순서를 준다 —
       반쯤 열었을 때 먼저 보여야 하는 건 일차 탭과 타임라인이다. */
    .lpops{display:contents}
    #editpop,#infopop{transform:none;margin:8px 10px 0}
    #editpop{order:1}
    .daytabs{order:2}
    .stambar{order:3}
    #plan{order:4}
    #sum{order:5}
    #infopop{order:6}

    /* 팝업·다이얼로그 폭 */
    #poipop{width:min(92vw,320px)}
    #buffpop{width:min(92vw,320px)}
    dialog.wide{width:94vw;padding:18px 16px}
    #toasts{top:auto;bottom:calc(var(--sheet-h,92px) + 52px);width:92vw}   /* 시계(좌하단) 위로 */

    /* 손가락 타깃 키우기 */
    .blk .bx{width:22px;height:22px;top:1px;right:1px}
    .blk .bx .ic{width:13px;height:13px}
    button.go{padding:11px;min-height:44px}
    .mini,.chip{min-height:34px}
    .mv,.x{padding:6px}
    /* 16px 미만 입력칸은 iOS 가 포커스 때 화면 전체를 확대해 버린다 */
    select,input[type=number]{font-size:16px;padding:4px 8px}
    input[type=number]{width:72px}
    /* 시트 손잡이를 두툼하게 — 20px 띠는 엄지로 집기 어렵다 */
    .panel.right{padding-top:26px}
    .panel.right .fold{height:26px}
    /* 홈 바(제스처 바)가 제출 버튼을 덮지 않게 */
    #sum{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  }
  #mfit{display:none;position:fixed;right:10px;bottom:calc(var(--sheet-h,92px) + 12px);z-index:13;
        width:44px;height:44px;border-radius:50%;align-items:center;justify-content:center;
        background:var(--panel);border:2.5px solid var(--ink);box-shadow:var(--hard);color:var(--ink)}
  /* 확대 버튼이 사라진 자리 — 핀치로 헤매다 돌아올 "전체 보기" 하나는 남긴다.
     기본 none 규칙보다 뒤에 있어야 이긴다. */
  @media (max-width:720px){#mfit{display:flex}}
  /* 터치 잡음 제거: 탭 하이라이트·더블탭 확대·길게 눌러 선택 */
  button,select,.chip,.mini,.blk,.card{touch-action:manipulation}
  *{-webkit-tap-highlight-color:transparent}
  #map,.fold,.blk{-webkit-user-select:none;user-select:none}
</style>

<script>
// ─────────────────────────────────────────────────────────────
// 엔진
// ─────────────────────────────────────────────────────────────
const DETOUR = 1.35;           // 직선거리 → 실도로 보정계수
const CAR_DAILY = 70000;       // 렌터카 1일 대여료
const DAY_START = 540;         // 2일차부터의 기본 기상 시각 (1일차는 부산 도착 시각)

// ── 체력 ────────────────────────────────────────────────────
// 이동은 체력을 깎고, 식사는 회복시킨다. 분당 소모량.
const DRAIN_MOVE = { walk: .45, bus: .25, subway: .20, taxi: .10, car: .13 };   // 도보가 가장 고됨
const DRAIN_STAY = { sight: .16, food: -.15, stay: 0 };     // 식사는 회복 (카페는 아래에서 절반)
// ── 영구 버프 ────────────────────────────────────────────────
// 레벨이 오를 때마다 2종 중 1개를 골라 영구히 얻는다. 효과는 compute() 안에서 적용.
// uses = 의뢰 한 판에서 쓸 수 있는 횟수. 앞에서부터 순서대로 소진된다.
const BUFFS = {
  hotelclub:   { name: '제휴 호텔',       ico: 'hotel',    uses: 2, unit: '박', desc: '호텔 숙박비 5% 할인' },
  transitpass: { name: '지역교통할인패스', ico: 'ticket',   uses: 2, unit: '일', desc: '대중교통비 하루 6,000원 상한' },
  groupticket: { name: '단체 입장권',     ico: 'percent',  uses: 3, unit: '곳', desc: '관광지 입장료 15% 할인' },
  taxicoupon:  { name: '택시 호출 쿠폰',   ico: 'car-taxi-front', uses: 2, unit: '회', desc: '택시 기본요금 면제' },
  rentalclub:  { name: '렌터카 멤버십',   ico: 'car',      uses: 1, unit: '일', desc: '렌터카 일 대여료 30% 할인' },
  foodie:      { name: '미식가 인맥',     ico: 'utensils', uses: 3, unit: '곳', desc: '식당 만족도 +2' },
  guide:       { name: '현지 가이드',     ico: 'sparkles', uses: 3, unit: '곳', desc: '관광지 만족도 +1' },
  comfyseat:   { name: '편안한 좌석',     ico: 'armchair', uses: 4, unit: '구간', desc: '이동 체력 소모 25% 감소' },
  sleepwell:   { name: '숙면 안대',       ico: 'moon',     uses: 1, unit: '박', desc: '6시간 30분만 자도 충분히 회복' }
};

const SLEEP_FULL = 480;        // 충분한 수면(8시간). 이보다 적으면 다음날 체력 한계가 준다.
// 숙소 등급별 회복 효율. 호텔은 같은 시간을 자도 다음날 체력 한계가 8% 높다.
const SLEEP_TIER = { guesthouse: .94, motel: 1, hotel: 1.08 };
const EARLY = [240, 480];      // 야행성이 힘들어하는 새벽 구간 (04:00~08:00)

// 구간 [a,b] 중 새벽 시간대에 걸친 분
function earlyMin(a, b) {
  let o = 0;
  for (let d = Math.floor(a / 1440); d <= Math.floor(b / 1440); d++)
    o += Math.max(0, Math.min(b, d * 1440 + EARLY[1]) - Math.max(a, d * 1440 + EARLY[0]));
  return o;
}
// 타입을 반영한 실제 소모량. rate>0 이면 소모, <0 이면 회복.
function drain(rate, a, b, type, isMove, buff) {
  const len = Math.max(0, b - a);
  let v = rate * len;
  if (isMove && buff && buff('comfyseat')) v *= .75;
  if (type === 'energizer') v *= .7;
  if (type === 'motionsick' && isMove) v *= 2;
  if (type === 'night' && v > 0) {                 // 새벽에 걸친 만큼만 가중
    const e = earlyMin(a, b);
    v = rate * ((len - e) + e * 1.6) * 1;
  }
  return v;
}
const TRANSPORT = {
  // walk = 정류장·역·주차장까지 걷는 시간, wait = 배차·호출·주차 대기. 둘의 합이 이동시간에 붙는다.
  walk:   { name: '도보',    ico: 'footprints',     kmh: 4.5, walk: 0, wait: 0, fare: () => 0 },
  bus:    { name: '버스',    ico: 'bus',            kmh: 18, walk: 5, wait: 3, fare: (km, p) => 1500 * p },
  subway: { name: '지하철',  ico: 'tram-front',     kmh: 26, walk: 4, wait: 2, fare: (km, p) => 1600 * p },
  taxi:   { name: '택시',    ico: 'car-taxi-front', kmh: 24, walk: 0, wait: 2, fare: (km, p) => Math.ceil(p / 4) * (4800 + Math.max(0, km - 2) * 1000) },
  car:    { name: '렌터카',  ico: 'car',            kmh: 28, walk: 3, wait: 7, fare: (km) => km * 200 }
};
const PUBLIC = ['bus', 'subway'];            // 교통패스가 적용되는 대중교통

// 출퇴근 시간대에는 도로가 막힌다. 지하철은 정시성이 있어 영향받지 않는다.
const RUSH = [[450, 570], [1080, 1200]];     // 07:30~09:30, 18:00~20:00
const RUSH_MODES = ['bus', 'taxi', 'car'];
// 이동 구간이 정체 시간대에 걸친 만큼만 비례해 늘린다 (전부 걸치면 1.5배)
function rushFactor(mode, from, min, weekend) {
  if (weekend || from == null || min <= 0 || !RUSH_MODES.includes(mode)) return 1;
  const to = from + min;
  let ov = 0;
  for (let d = Math.floor(from / 1440); d <= Math.floor(to / 1440); d++)
    for (const [a, b] of RUSH)
      ov += Math.max(0, Math.min(to, d * 1440 + b) - Math.max(from, d * 1440 + a));
  return 1 + .5 * Math.min(1, ov / min);
}
const TIER_RANK = { guesthouse: 1, motel: 2, hotel: 3 };
// d일차의 요일 (0=월 … 6=일)
const dowOf = (q, d) => q ? ((q.startDow || 0) + d) % 7 : 0;
const dowName = (r, n) => r.dayNames[n];
const isWeekend = n => n >= 5;           // 토·일
// 의뢰인 연령대가 이 관광지의 세부 타입을 선호하는가
function likesSub(q, p) {
  if (!q || p.type !== 'sight' || !p.sub) return false;
  const a = REGIONS[q.region || 'busan'].ageTypes[q.age];
  return !!a && a.likes.includes(p.sub);
}
const TIER_NAME = { guesthouse: '게스트하우스', motel: '모텔·레지던스', hotel: '호텔' };

function km(a, b) { // haversine
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

// ponytail: 직선거리×보정계수 근사. 실 API(카카오/TMap)로 바꾸려면 이 함수만 교체하면 됨.
// 지하철은 실측 노선(subway.gap)이 있으면 그 승차시간을 쓴다. 단 양쪽 역이 가까울 때만이다 —
// 역에서 2km 넘게 떨어진 곳은 그 구간을 실제로는 버스·택시로 가므로 실측 승차시간이 뜻을 잃는다.
// 그때는 종전대로 직선거리 근사로 돌아간다.
// 역까지 어떻게 가는가. 가까우면 걷고, 걸어서 갈 거리가 아니면 버스로 접근한다고 본다.
// (정관 순두부는 노포역에서 8.7km — 걸어서 116분이라고 하면 거짓말이고, 실제로는 버스를 탄다.)
const ACCESS_WALK_MAX = 15;              // 이 시간 넘게 걸어야 하면 버스로 갈아탄다(분)
function stationAccess(kmToStation) {
  const walk = kmToStation / TRANSPORT.walk.kmh * 60;
  if (walk <= ACCESS_WALK_MAX) return { min: Math.round(walk), byBus: false };
  // 버스로 접근: 주행 + 정류장 도보·대기. 짧은 접근이라 환승 대기가 크게 붙는다.
  const ride = kmToStation * DETOUR / TRANSPORT.bus.kmh * 60 + TRANSPORT.bus.walk + TRANSPORT.bus.wait;
  return { min: Math.round(Math.min(walk, ride)), byBus: ride < walk };
}
function subwayRide(a, b, region) {
  const p = subwayPath(a, b, region);
  if (!p || !p.min) return null;
  // 양 끝에서 역까지 가는 시간을 실제 거리로 낸다. 4분 고정이면 역이 8km 여도 4분이었다.
  const A = stationAccess(p.walkFrom), B = stationAccess(p.walkTo);
  return { ...p, accessMin: A.min + B.min, accessByBus: A.byBus || B.byBus };
}
function travel(a, b, mode, people, depart, weekend) {
  const t = TRANSPORT[mode], d = km(a, b) * DETOUR;
  const sp = mode === 'subway' ? subwayRide(a, b) : null;
  // 버스는 통합 경로표(실제 노선·환승)를 쓴다. 표에 없는 지점(임의 좌표)은 근사로 남는다.
  // transit 의 값은 승차·환승 대기를 이미 품고 있어 TRANSPORT.walk/wait 와 겹치는데,
  // 그 둘은 "집→정류장" 접근분이라 성격이 달라 그대로 더한다.
  const tp = mode === 'bus' ? transitPath(a, b) : null;
  // 실측이 있으면 그 값을, 없으면 직선거리 ÷ 속도
  const ride = sp ? sp.min : tp ? tp.min : Math.round(d / t.kmh * 60);
  // 언덕 위·노선에서 먼 곳은 정류장에서 문 앞까지가 유난히 멀다(POI 의 access, 분).
  // 대중교통에만 붙는다 — 택시·렌터카는 문 앞까지 가고, 도보는 이미 문 앞까지 걷는다.
  const acc = PUBLIC.includes(mode) ? (a.access || 0) + (b.access || 0) : 0;
  // 정체는 주행 구간만 늘린다. 걷고 기다리는 시간은 길이 막혀도 그대로다.
  const f = rushFactor(mode, depart, ride, weekend);
  // 지하철은 역까지의 실제 거리로 접근시간을 낸다(walk 상수 4분은 역이 코앞일 때 얘기다).
  const fixed = (sp && sp.accessMin !== undefined ? sp.accessMin : t.walk) + t.wait + acc;
  const min = Math.round(ride * f) + fixed;
  // 도보 수단은 구간 전체가 걷는 시간, 나머지는 정류장까지 접근하는 시간만
  return { min, base: ride + fixed, rush: f > 1, km: d, real: !!(sp || tp),
           walkMin: mode === 'walk' ? min : (sp && sp.accessMin !== undefined ? sp.accessMin : t.walk) + acc,
           waitMin: t.wait, cost: Math.round(t.fare(d, people)) };
}

// ── 지하철 경로 안내 (data/subway.js) ──────────────────────────
// 실제 노선·역 순서로 "1호선 자갈치역 → 서면역 환승 → 2호선 해운대역" 을 만든다.
// travel() 이 이 승차시간을 그대로 쓴다(양쪽 역이 2km 안일 때. 먼 곳은 직선거리 근사로 남는다).
// 가중치는 실제 역간 소요시간(초)이다 — subway.gap[노선][i] = [거리km, 소요초].
// 역간 편차가 커서(부전~서면 65초 vs 증산~호포 250초) 정거장 수로 세면 경로가 틀린다.
const DWELL = 25;                        // 역당 정차시간(초)
// 환승 1회 = 도보 + 반대편 열차 대기. 옛 근사(5정거장)를 실측 기반 초로 바꾼 값이다.
const TRANSFER_SEC = 300;
const stName = k => k + '역';            // 데이터는 "역" 을 뗀 키로 들고 있다
function subwayOf(region) { return REGIONS[region || S.region].subway; }
// 어떤 지점에서 가장 가까운 역
function nearestStation(p, region) {
  const sw = subwayOf(region); if (!sw || !p) return null;
  let best = null;
  for (const k in sw.pos) {
    const d = km(p, { lat: sw.pos[k][0], lng: sw.pos[k][1] });
    if (!best || d < best.km) best = { st: k, km: d };
  }
  return best;
}
// 역|노선 을 노드로 둔 그래프. 인접역 1, 같은 역의 다른 노선(환승) TRANSFER_COST.
function subwayGraph(region) {
  const sw = subwayOf(region); if (!sw) return null;
  if (sw._g) return sw._g;               // 노선표는 안 변하므로 한 번만 만든다
  const adj = {}, lines = {};
  const link = (u, v, w) => { (adj[u] = adj[u] || []).push([v, w]); };
  sw.lines.forEach(L => L.st.forEach((s, i) => {
    (lines[s] = lines[s] || []).push(L.id);
    if (i) {
      const g = (sw.gap && sw.gap[L.id] || [])[i - 1];       // st[i-1] → st[i] 구간
      const w = (g ? g[1] : 90) + DWELL;                     // 주행 + 정차. 데이터 없으면 90초로 본다
      const a = s + '|' + L.id, b = L.st[i - 1] + '|' + L.id;
      link(a, b, w); link(b, a, w);
    }
  }));
  for (const s in lines) lines[s].forEach(x => lines[s].forEach(y => { if (x !== y) link(s + '|' + x, s + '|' + y, TRANSFER_SEC); }));
  return (sw._g = { adj, lines });
}
// 두 지점 사이 지하철 경로. 노선별 구간과 환승 횟수를 돌려준다.
function subwayPath(a, b, region) {
  const sw = subwayOf(region), g = subwayGraph(region);
  if (!sw || !g) return null;
  const A = nearestStation(a, region), B = nearestStation(b, region);
  if (!A || !B || A.st === B.st) return null;
  const dist = {}, prev = {};
  (g.lines[A.st] || []).forEach(l => dist[A.st + '|' + l] = 0);
  const seen = {};
  for (;;) {
    let u = null;
    for (const k in dist) if (!seen[k] && (u === null || dist[k] < dist[u])) u = k;
    if (u === null) break;
    seen[u] = 1;
    for (const [v, w] of (g.adj[u] || [])) {
      if (dist[v] === undefined || dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; }
    }
  }
  let end = null;
  (g.lines[B.st] || []).forEach(l => { const k = B.st + '|' + l;
    if (dist[k] !== undefined && (end === null || dist[k] < dist[end])) end = k; });
  if (end === null) return null;
  const path = []; for (let n = end; n; n = prev[n]) path.unshift(n);
  // 같은 노선끼리 묶어 구간으로 만든다
  // 노선 안 인접역 구간의 거리·소요시간을 gap 에서 되찾는다
  const segOf = (line, a, b) => {
    const L = sw.lines.find(x => x.id === line); if (!L) return null;
    const i = L.st.indexOf(a), j = L.st.indexOf(b);
    if (i < 0 || j < 0 || Math.abs(i - j) !== 1) return null;
    return ((sw.gap && sw.gap[line] || [])[Math.max(i, j) - 1]) || null;
  };
  const legs = [];
  path.forEach((n, idx) => {
    const [st, line] = n.split('|');
    const last = legs[legs.length - 1];
    if (last && last.line === line) {
      const g = segOf(line, last.to, st);
      last.to = st; last.stops++;
      last.km += g ? g[0] : 0; last.sec += (g ? g[1] : 90) + DWELL;
    }
    else legs.push({ line, from: st, to: st, stops: 0, km: 0, sec: 0 });
  });
  const real = legs.filter(l => l.stops > 0);          // 환승만 하고 안 탄 구간은 뺀다
  if (!real.length) return null;
  const nameOf = id => (sw.lines.find(L => L.id === id) || {}).name || id + '호선';
  const transfers = real.length - 1;
  const rideSec = real.reduce((s, l) => s + l.sec, 0);
  return { legs: real.map(l => ({ ...l, name: nameOf(l.line), color: (sw.lines.find(L => L.id === l.line) || {}).color,
                                 min: Math.round(l.sec / 60) })),
           transfers,
           stops: real.reduce((s, l) => s + l.stops, 0),
           rideMin: Math.round(rideSec / 60),                       // 순수 승차(정차 포함)
           transferMin: Math.round(transfers * TRANSFER_SEC / 60),  // 환승 도보·대기
           min: Math.round((rideSec + transfers * TRANSFER_SEC) / 60),
           rideKm: +real.reduce((s, l) => s + l.km, 0).toFixed(1),
           fromSt: A.st, toSt: B.st, walkFrom: A.km, walkTo: B.km };
}
// 같은 쌍은 결과가 불변이라(좌표·노선표 고정) 한 번만 푼다. 경로표 없는 지역(후쿠오카)은
// travel() 이 부를 때마다 다익스트라를 새로 돌아 렌더·밸런스가 그만큼 느려진다 —
// 밸런스는 이 메모 없이 11분 넘게 걸렸다. 임의 좌표(id 없음)는 좌표를 키로 쓴다.
{
  const raw = subwayPath, memo = new Map();
  const keyOf = p => p ? (p.id || p.lat + ',' + p.lng) : '';
  subwayPath = (a, b, region) => {
    const k = (region || S.region) + '|' + keyOf(a) + '|' + keyOf(b);
    if (!memo.has(k)) memo.set(k, raw(a, b, region));
    return memo.get(k);
  };
}
// "1호선 부산역→서면역 · 2호선 서면역→해운대역" 형태의 한 줄 요약
const subwayText = p => !p ? ''
  : p.legs.map(l => `${l.name} ${stName(l.from)}→${stName(l.to)}`).join(' · ')
    + (p.min ? ` (${p.min}분)` : '');

// ── 대중교통 통합 경로 (data/transit.js) ───────────────────────
// 버스+지하철을 한 그래프로 풀어 미리 구운 표다. 지하철만으로 못 가는 곳(태종대·해동용궁사 등)이
// 버스 환승으로 이어진다. 표는 상삼각만 담겨 있어 a→b 가 없으면 b→a 를 뒤집어 읽는다
// (양방향 차이는 평균 1.9분이라 무시한다).
let _tx = null;
function transitOf(region) {
  const T = REGIONS[region || S.region].transit;
  if (!T) return null;
  if (!T._i) {                                  // 조회용 색인은 한 번만 만든다
    const oi = {}, mp = {};
    T.ord.forEach((k, i) => oi[k] = i);
    T.pair.forEach(([a, b, m, g]) => mp[a + '_' + b] = { m, g });
    T._i = { oi, mp };
  }
  return T;
}
// 두 지점 사이 통합 경로. { min, legs:[{mode,from,to,lines,stops}] }
function transitPath(a, b, region) {
  const T = transitOf(region); if (!T || !a || !b || !a.id || !b.id) return null;
  const { oi, mp } = T._i;
  const i = oi[a.id], j = oi[b.id];
  if (i === undefined || j === undefined || i === j) return null;
  const fwd = mp[i + '_' + j], cell = fwd || mp[j + '_' + i];
  if (!cell) return null;
  const legs = cell.g.map(g => ({
    mode: g[0] ? 'bus' : 'subway',
    from: T.st[g[1]], to: T.st[g[2]],
    lines: g[3].map(k => T.ln[k]), stops: g[4]
  }));
  if (!fwd) {                                   // 역방향이면 구간 순서와 양 끝을 뒤집는다
    legs.reverse();
    legs.forEach(l => { const t = l.from; l.from = l.to; l.to = t; });
  }
  const transfers = Math.max(0, legs.length - 1);
  return { min: cell.m, legs, transfers,
           modes: [...new Set(legs.map(l => l.mode))] };
}
// "2호선 해운대→수영 · 1호선 연산→토성 · 버스 17" 한 줄 요약
const transitText = p => !p ? ''
  : p.legs.map(l => l.mode === 'subway'
      ? `${l.lines[0] || '?'}호선 ${l.from}→${l.to}`
      : `버스 ${l.lines.slice(0, 2).join('·')}`).join(' · ');

// ── 도시간 교통편 예매 ───────────────────────────────────────
// 여행지까지 오는 편은 손님이 직접 끊는다. 시간대는 네 개고, 늦게 떠나는 편일수록 싸다
// (저녁 < 오후 < 오전 < 새벽). 싼 표의 값은 돈이 아니라 시간이다 — 저녁편을 끊으면
// 첫날이 통째로 날아가고, 새벽편은 첫날을 다 쓰는 대신 요금을 25% 더 낸다.
// dep 은 예매편(기차·항공·버스·배)의 출발 시각, drive 는 자차 출발 시각이다.
// 자차만 새벽 출발을 3시까지 당길 수 있어 톨게이트 심야할인(0~5시)에 걸린다.
const SLOTS = [
  { id: 'dawn', name: '새벽', ico: 'moon',    rate: 1.25, dep: [310, 370, 430],    drive: [180, 240, 300] },
  { id: 'am',   name: '오전', ico: 'sunrise', rate: 1.10, dep: [490, 550, 610],    drive: [450, 510, 570] },
  { id: 'pm',   name: '오후', ico: 'sun',     rate: 0.95, dep: [790, 850, 910],    drive: [780, 840, 900] },
  { id: 'eve',  name: '저녁', ico: 'sunset',  rate: 0.80, dep: [1090, 1150, 1210], drive: [1080, 1140, 1200] }
];
const LAST_ARRIVE = 1380;      // 23시 넘겨 닿는 편은 팔지 않는다 (그날 일정이 성립하지 않는다)
const TOLL_NIGHT = 0.5;        // 고속도로 심야할인 — 0~5시 출발이면 통행료 반값
const FUEL = { kmpl: 12, price: 1700 };   // 연비 12km/L · 휘발유 1,700원/L (지역이 fuel 로 덮어쓸 수 있다)
// 출발 시각 → 시간대. 자차의 이른 출발까지 같은 칸에 들어가도록 경계를 넉넉히 잡는다.
const slotOf = dep => SLOTS[dep < 450 ? 0 : dep < 720 ? 1 : dep < 1020 ? 2 : 3];
// 예매 창구 간판. 데이터가 brand 를 주면 그걸 쓰고, 없으면 아이콘으로 고른다.
const BRANDS = {
  'train-front': { nm: '코레일',     sub: '승차권 예매', tag: 'KORAIL' },
  plane:         { nm: '항공사',     sub: '항공권 예매', tag: 'AIRLINE' },
  bus:           { nm: '고속버스',   sub: '승차권 예매', tag: 'EXPRESS' },
  ship:          { nm: '여객선',     sub: '승선권 예매', tag: 'FERRY' },
  car:           { nm: '자차',       sub: '출발 시각',   tag: 'DRIVE' }
};
const brandOf = o => o.brand || BRANDS[o.ico] || { nm: o.name, sub: '예매', tag: 'TICKET' };
// 편명. 실제 시각표는 아니고 예매 화면처럼 보이라고 붙이는 번호다.
const TRIP_NO = {
  'train-front': n => 'KTX ' + (101 + n * 2),
  plane:         n => ['BX 8802', 'KE 1403', 'OZ 8505', 'LJ 8005', 'TW 991', '7C 501',
                       'BX 8806', 'KE 1409', 'OZ 8511', 'LJ 8009', 'TW 995', '7C 507'][n % 12],
  bus:           n => ['프리미엄', '우등', '일반'][n % 3] + '고속',
  ship:          n => ['뉴스타호', '실버클라우드'][n % 2],
  car:           () => '자차'
};
const tripNo = (o, n) => (TRIP_NO[o.ico] || (i => '제' + (i + 1) + '편'))(n);

// 자차 비용 내역. 요금표가 없으니 주행거리로 기름값을 내고 톨게이트비를 더한다.
function carBill(R, o, dep) {
  if (!o.km) return { fuel: o.cost || 0, toll: 0, night: false, km: 0 };
  const f = R.fuel || FUEL;
  const fuel = Math.round(o.km / f.kmpl * f.price / 100) * 100;
  const night = dep != null && dep >= 0 && dep < 300;   // 0~5시 출발 (음수는 전날 출발이라 해당 없다)
  return { fuel, toll: Math.round((o.toll || 0) * (night ? TOLL_NIGHT : 1) / 100) * 100, night, km: o.km };
}
// 1인(자차는 1대) 요금. dep 이 없으면 아직 예매 전이라 데이터의 정가 그대로.
function fareOf(R, o, dep) {
  if (o.per === 'car') { const b = carBill(R, o, dep); return b.fuel + b.toll; }
  return dep == null ? o.cost : Math.round(o.cost * slotOf(dep).rate / 100) * 100;
}
// 그 교통수단으로 끊을 수 있는 편 목록. 시간대마다 세 편씩 깔고,
// 자정 가까이 닿는 편은 뺀다(고속버스 저녁편·여객선 오후편이 이렇게 빠진다).
// 하루 한두 편뿐이라 정기 시간대에 안 맞는 노선(밤배·야간열차)은 데이터가 deps 로 직접 적는다:
//   deps: [{ dep, arrive, fare, no }]  — dep 이 음수면 전날 출발이라는 뜻이다.
// 옵션 객체는 그대로 고정된 데이터라 목록을 한 번 만들어 두고 재사용한다
// (compute() 마다 다시 만들면 탐색 도구가 수백만 번 다시 굽는다).
function tripsOf(R, o) {
  if (o._trips) return o._trips;
  const out = [];
  if (o.deps) o.deps.forEach((d, i) => {
    const arrive = d.arrive != null ? d.arrive : d.dep + o.min;
    out.push({ slot: slotOf(((d.dep % 1440) + 1440) % 1440), dep: d.dep, arrive, min: arrive - d.dep,
               no: d.no || tripNo(o, i), fare: d.fare != null ? d.fare : fareOf(R, o, d.dep) });
    out.at(-1).si = SLOTS.indexOf(out.at(-1).slot);

  }));

    const dep = Math.max(0, o.arrive - o.min);
    out.push({ slot: slotOf(dep), si: 0, dep, arrive: o.arrive, min: o.min, no: tripNo(o, 0), fare: fareOf(R, o, dep) });

// 손님이 고른 도착 교통편. 없으면 그 출발지의 첫 번째.
// depMin(예매한 편의 출발 시각)이 있으면 그 편의 출발·도착·요금으로 갈아끼운다.
function arrival(state) {
  const q = state.quest; if (!q) return null;
  const R = REGIONS[state.region];
  const o = (R.origins[q.from] || []).find(x => x.id === state.arriveId) || (R.origins[q.from] || [])[0] || null;
  if (!o || state.depMin == null) return o;
  const t = tripsOf(R, o).find(x => x.dep === state.depMin);
  if (!t) return o;                      // 데이터가 바뀌어 없어진 편 — 정가·기본 도착으로 되돌린다
  return Object.assign({}, o, { dep: t.dep, arrive: t.arrive, min: t.min, fare: t.fare, no: t.no });

// 시작지점 = 도착 교통편이 내려주는 곳
function startPoint(state) {

  return unit * (a.per === 'car' ? Math.ceil(people / 4) : people);

// 전날 밤에 떠나는 밤배는 출발 시각이 음수(전날)라 그대로 나누면 "-2:-30" 이 된다 — 하루 안으로 접는다.

const won = n => Math.round(n).toLocaleString('ko-KR') + '원';

// 일정 시뮬레이션 → 타임라인 + 비용 + 위반사항
// 만족도는 숫자로 보여주지 않는다 — 손님이 얼마나 좋아할지는 원래 알 수 없는 값이고,
// 숫자가 보이면 플레이어가 고르는 대신 계산해 버린다. 대신 어림잡을 단서만 준다.
const joyTag = j => j >= 9 ? '놓치면 아쉬운 곳' : j >= 7 ? '가볼 만한 곳' : '지나는 길에';

// 이어 붙이면 좋은 조합. 순서를 가리지 않으므로 키는 id 두 개를 정렬해 만든다.
const pairKey = (a, b) => a < b ? a + '|' + b : b + '|' + a;

  return R._pidx;

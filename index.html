function compute(state) {
  const R = REGIONS[state.region], q = state.quest;
  const people = q ? q.people : 2, maxDay = q ? q.days : 1;
  const arr = arrival(state);
  const wakeAt = d => d === 0 ? (arr ? arr.arrive : state.startMin)
                              : d * 1440 + ((state.wake || {})[d] ?? DAY_START);
  let cur = wakeAt(0), day = 0, prev = startPoint(state);
  let spend = 0, moveMin = 0, joy = 0, stays = 0;
  const bills = [];                 // 경비 내역 — 총 경비를 눌렀을 때 펼치는 목록
  const carDays = new Set(), rows = [], bad = [], warn = [], visited = new Set();
  // bad 는 물리적으로 성립할 수 없는 일정(제출 차단), warn 은 손님 기대에 못 미치는 판단(제출은 된다).
  const PIDX = pairIndex(R), pairHit = [], pairSeen = new Set();
  let prevDay = -1;                            // 조합은 같은 날 이어 붙였을 때만 성립한다

  // 버프: 보유 여부(has)와 별도로, 쓸 때마다 횟수를 깎는 use() 를 쓴다.
  const has = id => (state.buffs || []).includes(id);
  const left = {};
  (state.buffs || []).forEach(b => { if (BUFFS[b]) left[b] = BUFFS[b].uses; });
  const use = id => { if (left[id] > 0) { left[id]--; return true; } return false; };
  const sleepNeed = has('sleepwell') ? 390 : SLEEP_FULL;
  const transitDay = {};                       // 교통패스 상한 계산용

  // 체력: 1일차는 부산까지 오느라 이미 얼마간 쓴 상태로 시작한다
  const type = q ? q.staminaType : 'energizer';
  const full = q ? q.stamina : 100;
  let cap = full, stam = full;
  if (arr) stam -= drain(arr.drain ?? .08, wakeAt(0) - arr.min, wakeAt(0), type, true, null);
  const dayStat = [{ cap, start: stam, low: stam }];
  const useStam = v => { stam = Math.min(cap, stam - v); dayStat[day].low = Math.min(dayStat[day].low, stam); };

  for (let i = 0; i < state.plan.length; i++) {
    const e = state.plan[i], p = poi(e.id);
    const dow = dowOf(q, day);
    const t = travel(prev, p, e.mode, people, cur, isWeekend(dow));
    const arrive = cur + t.min;
    const openAt = day * 1440 + p.open[0], closeAt = day * 1440 + p.open[1];
    const begin = Math.max(arrive, openAt);
    const end = begin + e.stay;
    const errs = [];

    if (day >= maxDay) errs.push(`${maxDay}일차를 초과했습니다`);
    if (p.closed && p.closed.includes(dow)) errs.push(`${dowName(R, dow)}요일 휴무일`);
    if (arrive > closeAt) errs.push(`영업 종료(${hhmm(p.open[1])}) 이후 도착`);
    else if (end > closeAt) errs.push(`영업 종료(${hhmm(p.open[1])}) 전에 못 나옴`);
    if (end > day * 1440 + 1440) errs.push('자정을 넘김');

    // 비용 (버프 반영)
    let payFor = p.type === 'stay' ? Math.ceil(people / 2) : people;
    let placeCost = p.cost * payFor;
    if (p.type === 'stay' && R.weekendStay.days.includes(dow)) placeCost *= R.weekendStay.rate;   // 금·토 할증
    if (p.type === 'stay' && p.tier === 'hotel' && has('hotelclub') && use('hotelclub')) placeCost *= .95;
    if (p.type === 'sight' && p.cost > 0 && has('groupticket') && use('groupticket')) placeCost *= .85;
    let legCost = t.cost;
    if (e.mode === 'taxi' && has('taxicoupon') && use('taxicoupon')) legCost = Math.max(0, legCost - 4800 * Math.ceil(people / 4));
    if (PUBLIC.includes(e.mode)) transitDay[day] = (transitDay[day] || 0) + legCost;
    placeCost = Math.round(placeCost); legCost = Math.round(legCost);
    spend += placeCost + legCost;
    if (legCost) bills.push({ day, what: `${p.name} 이동`, ico: TRANSPORT[e.mode].ico, amt: legCost });
    if (placeCost) bills.push({ day, what: p.name, ico: p.type === 'stay' ? 'bed-double' : p.type === 'food' ? 'utensils' : 'ticket', amt: placeCost });
    if (e.mode === 'car') carDays.add(day);
    moveMin += t.min;
    // 같은 숙소 연박은 매번 만족도를 주지만, 관광지·식당 재방문은 첫 방문만 인정
    if (p.type === 'stay' || !visited.has(p.id))
      joy += p.joy
           + (p.type === 'food' && has('foodie') && use('foodie') ? 2 : 0)
           + (p.type === 'sight' && has('guide') && use('guide') ? 1 : 0)
           + (likesSub(q, p) ? 3 : 0);
    visited.add(p.id);
    // 직전 일정과 짝이면 만족도가 더 붙는다. 하루 자고 난 뒤는 "이어 붙였다"고 볼 수 없어 같은 날만
    // 인정하고, 같은 조합을 반복해 쌓지도 못한다.
    const pr = (i > 0 && day === prevDay) ? PIDX[pairKey(state.plan[i - 1].id, p.id)] : null;
    if (pr && !pairSeen.has(pr)) { pairSeen.add(pr); joy += pr.joy; pairHit.push({ i, pair: pr }); }
    prevDay = day;

    // 체력: 이동으로 깎이고, 머무는 동안 종류에 따라 깎이거나 회복된다
    const dMove = drain(DRAIN_MOVE[e.mode], cur, arrive, type, true, null)
                  * (has('comfyseat') && use('comfyseat') ? .75 : 1);
    const dStay = drain(DRAIN_STAY[p.type] * (p.type === 'food' && p.sub === 'cafe' ? .5 : 1), begin, end, type, false, has);
    useStam(dMove); useStam(dStay);

    rows.push({ i, poi: p, day, leg: t, mode: e.mode, arrive, wait: begin - arrive, begin, end, stay: e.stay,
                cost: placeCost + legCost, errs, dMove, dStay, stam });
    errs.forEach(m => bad.push(`${p.name}: ${m}`));

    prev = p;
    if (p.type === 'stay') {
      // 취침 → 수면 시간만큼 회복. 부족하면 다음날 한계 자체가 준다.
      const bed = arrive, nextWake = wakeAt(day + 1), sleep = Math.max(0, nextWake - bed);
      const bedRel = bed - day * 1440;
      const need = (has('sleepwell') && use('sleepwell')) ? 390 : SLEEP_FULL;
      // 잠자리가 좋을수록 같은 시간을 자도 더 회복한다 — 비싼 숙소가 만족도 말고도 값어치를 갖게.
      let next = full * Math.max(.5, Math.min(1.1, sleep / need)) * (SLEEP_TIER[p.tier] || 1);
      if (type === 'morning' && bedRel > 1380)          // 23시 넘겨 자면 아침형은 추가 손해
        next -= full * .04 * Math.ceil((bedRel - 1380) / 30);
      stays++; day++;
      cap = Math.max(full * .3, Math.round(next));
      stam = cap; cur = nextWake;
      dayStat.push({ cap, start: stam, low: stam, sleep, bed });
    } else cur = end;
  }
  while (dayStat.length < maxDay) dayStat.push({ cap: full, start: full, low: full });
  dayStat.forEach((s2, d) => { if (s2.low < 0) warn.push(`${d + 1}일차 체력 소진 (${Math.round(s2.low)})`); });
  // 마지막 일정에서 출발지점으로 돌아가는 구간 (지도의 출발지점을 눌러 지정)
  let back = null;
  if (q && state.ret && state.plan.length) {
    const homePt = startPoint(state), bd = dowOf(q, day);
    const t = travel(prev, homePt, state.ret.mode, people, cur, isWeekend(bd));
    spend += t.cost; moveMin += t.min;
    if (t.cost) bills.push({ day, what: `${homePt.name} 귀가 이동`, ico: TRANSPORT[state.ret.mode].ico, amt: Math.round(t.cost) });
    useStam(drain(DRAIN_MOVE[state.ret.mode], cur, cur + t.min, type, true, has));
    back = { leg: t, mode: state.ret.mode, day, begin: cur, end: cur + t.min, name: homePt.name };
    // 손님마다 그날 몇 시까지 돌아와야 하는지가 정해져 있다
    const due = day * 1440 + (q.endBy || 1440);
    if (back.end > due) warn.push(`귀가 마감 ${hhmm(q.endBy || 1440)} 초과 (${hhmm(back.end)} 도착)`);
    // 집까지 가는 도시간 귀가편. 요금을 왕복으로 걷으니(아래 inter) 시간도 같이 센다.
    // 마감은 출발지점 도착 기준이라 이 구간은 마감 판정에 넣지 않는다.
    if (arr) { moveMin += arr.min; back.home = { min: arr.min, name: q.from, ico: arr.ico, via: arr.name }; }
  }

  // 자차로 왔으면 여행 내내 그 차를 쓰므로 렌터카 대여료가 없다
  // 렌터카 일 대여료 — 멤버십은 정해진 일수만큼만 할인
  if (!(arr && arr.per === 'car'))
    [...carDays].sort((a, b) => a - b).forEach(d => {
      const c = CAR_DAILY * (has('rentalclub') && use('rentalclub') ? .7 : 1);
      spend += c;
      bills.push({ day: d, what: '렌터카 대여료', ico: 'car', amt: Math.round(c) });
    });
  // 교통패스: 대중교통비는 하루 6,000원을 넘지 않는다
  if (has('transitpass')) Object.keys(transitDay).sort((a, b) => a - b).forEach(d => {
    if (!use('transitpass')) return;
    const cut = Math.max(0, transitDay[d] - 6000);
    spend -= cut;
    if (cut) bills.push({ day: +d, what: '교통패스 상한', ico: 'ticket', amt: -Math.round(cut) });
  });
  spend = Math.round(spend);
  const trip = state.ret ? 2 : 1;                           // 귀가편까지 정하면 왕복 요금
  const inter = arrivalCost(state) * trip;
  spend += inter;
  const rt = trip > 1 ? ' 왕복' : '';
  if (arr && arr.per === 'car' && arr.km && !arr.deps) {
    // 자차는 표값이 없다 — 기름값과 톨게이트비를 따로 적어야 어디로 돈이 나갔는지 보인다.
    const cars = Math.ceil(people / 4), cb = carBill(R, arr, state.depMin), head = [];
    const many = cars > 1 ? ` ×${cars}대` : '';
    if (cb.fuel) head.push({ day: 0, ico: 'fuel', amt: Math.round(cb.fuel * cars * trip),
                             what: `유류비 ${arr.km}km${many}${rt}` });
    if (cb.toll) head.push({ day: 0, ico: 'receipt', amt: Math.round(cb.toll * cars * trip),
                             what: `통행료${cb.night ? ' 심야할인' : ''}${many}${rt}` });
    bills.unshift(...head);
  } else if (inter) bills.unshift({ day: 0, what: `${arr ? arr.name : '도착 교통편'}${rt}`,
                                    ico: arr ? arr.ico : 'map-pin', amt: Math.round(inter) });

  // 제약 검사
  if (q) {
    const ids = state.plan.map(e => e.id);
    q.must.forEach(id => { if (!ids.includes(id)) warn.push(`필수 코스 누락: ${poi(id).name}`); });
    const sights = new Set(state.plan.filter(e => poi(e.id).type === 'sight').map(e => e.id)).size;
    if (sights < q.minSights) warn.push(`관광지 ${q.minSights}곳 이상 필요 (현재 ${sights})`);
    if (stays !== q.days - 1) bad.push(`숙소는 ${q.days - 1}곳 필요 (현재 ${stays})`);

    (q.banModes || []).forEach(m => {
      if (state.plan.some(e => e.mode === m)) warn.push(`${TRANSPORT[m].name} 이용 불가 의뢰`);
    });
    if (q.minStayTier) state.plan.forEach(e => {
      const p = poi(e.id);
      if (p.type === 'stay' && TIER_RANK[p.tier] < TIER_RANK[q.minStayTier])
        warn.push(`숙소 등급 부족: ${p.name} (${TIER_NAME[q.minStayTier]} 이상 요구)`);
    });
    if (state.plan.length && poi(state.plan.at(-1).id).type === 'stay')
      bad.push('마지막 일정이 숙소입니다 (마지막 날은 취침 불필요)');
    if (state.plan.length && !state.ret) bad.push('돌아가는 교통편이 없습니다 (지도의 출발지점을 누르세요)');
  }

  const budget = q ? q.budget : 0;
  // 예산이 남으면 보너스, 넘기면 두 배로 감점 (제출은 막지 않는다)
  // 예산 초과는 감점만으로는 못 막는다 — 장소를 더 넣어 버는 만족도가 초과 감점보다 커서
  // "예산을 버리고 많이 넣기" 가 최적해가 된다. 제출은 되지만 별은 없다.
  if (budget && spend > budget) warn.push(`예산 초과 (${won(spend - budget)})`);
  const ratio = budget ? (budget - spend) / budget : 0;
  const score = Math.round(joy * 10 - moveMin * 1.0 + ratio * (ratio >= 0 ? 100 : 200));
  const over = Math.max(0, spend - budget);
  return { rows, spend, moveMin, joy, score, bad, warn, pairHit, over, left, days: day + 1, dayStat, full, type, back, bills };
}

function stars(score, par) { return score >= par * 1.25 ? 3 : score >= par ? 2 : score >= par * 0.75 ? 1 : 0; }

// ─────────────────────────────────────────────────────────────
// 상태
// ─────────────────────────────────────────────────────────────
const SAVE = 'travelgame.v1';
const S = Object.assign({ region: 'busan', quest: null, plan: [], startMin: 540, startId: null, buffs: [], sel: null, pop: null, gu: null, day: 0, arriveId: null, depMin: null, ret: null, wake: {}, tab: 'all', sub: null, xp: 0, cleared: [] },
  JSON.parse(localStorage.getItem(SAVE) || '{}'));
S.plan = S.plan || [];

// ── 지역 선택 ────────────────────────────────────────────────
// REGIONS 를 훑어 카드를 만든다. 지역을 추가하면 여기 코드는 손대지 않아도 된다.
function renderRegions() {
  const box = $('#regionList');
  box.innerHTML = Object.keys(REGIONS).map(key => {
    const R = REGIONS[key];
    const ready = !!(R.pois && R.pois.length && R.quests && R.quests.length);
    const thumb = R.mapImage ? `<img src="${esc(R.mapImage.src)}" alt="">` : ic('map');
    const sub = ready ? `장소 ${R.pois.length}곳 · 의뢰 ${R.quests.length}건` : '준비 중';
    return `<button class="rcard ${key === S.region ? 'on' : ''}" data-region="${esc(key)}"
      ${ready ? '' : 'disabled'}>
      ${ready ? '' : '<span class="soon">준비 중</span>'}
      <div class="thumb">${thumb}</div>
      <div class="rbody"><div class="rnm">${esc(R.name)}</div><div class="rsub">${sub}</div></div>
    </button>`;
  }).join('');
}
// 받침이 있으면 '으로', 없으면 '로'. 한글 음절의 종성 여부로 가른다(로/으로는 ㄹ 받침도 '로').
function euro(w) {
  const c = w.charCodeAt(w.length - 1) - 0xAC00;
  if (c < 0 || c > 11171) return w + '로';          // 한글이 아니면 그냥 로
  const jong = c % 28;
  return w + (jong === 0 || jong === 8 ? '로' : '으로');   // 8 = ㄹ
}
// 지역을 바꾸면 그 지역 기준으로 처음부터 짠다 — 장소·의뢰가 통째로 다르기 때문이다.
// 짜던 일정이 있으면 날아가므로 한 번 확인받는다.
function chooseRegion(key) {
  if (!REGIONS[key]) return;
  if (key === S.region) { $('#region').close(); S.regionPicked = true; save(); return; }
  // 잃을 게 있을 때만 묻는다. 의뢰도 안 고른 상태면 그냥 넘어간다.
  const busy = S.quest || (S.plan && S.plan.length);
  if (!busy) { applyRegion(key); return; }
  // 모달 위에 모달을 띄우면 겹쳐서 못 누른다 — 지역창을 닫고 묻는다.
  $('#region').close();
  const n = (S.plan || []).length;
  ask('지역을 바꿀까요?',
      `${euro(REGIONS[key].name)} 옮기면 지금 의뢰와 일정${n ? ` ${n}곳` : ''}이 사라집니다. `
      + '장소와 의뢰가 지역마다 달라 이어서 짤 수 없습니다.',
      euro(REGIONS[key].name) + ' 가기',
      () => applyRegion(key),
      () => { renderRegions(); $('#region').showModal(); });   // 취소하면 제자리로
}
function applyRegion(key) {
  S.region = key;
  S.regionPicked = true;
  S.quest = null; S.plan = []; S.sel = null; S.pop = null; S.day = 0;
  S.arriveId = null; S.depMin = null; S.ret = null; S.wake = {}; S.gu = null; S.tab = 'all'; S.sub = null;
  $('#region').close();
  save();
  document.title = '여행설계사 · ' + REGIONS[key].name;
  renderMap._c = null;   // 핀 배치 캐시는 지역이 다르면 못 쓴다
  render();
  fitView();             // 지도 범위가 통째로 다르다 — render 뒤에 맞춰야 캔버스 크기가 잡힌다
  if (!S.quest) $('#pick').showModal();
}

const level = () => Math.min(5, 1 + Math.floor(S.xp / 120));
const hasBuff = id => S.buffs.includes(id);
const ST = q => REGIONS[S.region].staminaTypes[q.staminaType];
const AT = q => REGIONS[S.region].ageTypes[q.age];
const SUBT = p => REGIONS[S.region].sightTypes[p.sub] || { name: '관광지', ico: 'camera' };
const FOODT = p => REGIONS[S.region].foodTypes[p.sub] || { name: '식당', ico: 'utensils' };
// 지금 보고 있는 일차에 이 장소가 쉬는가
const isClosedToday = p => !!(p.closed && S.quest && p.closed.includes(dowOf(S.quest, S.day)));
// 이동시간 안에 걷는 시간이 얼마나 섞였는지. 실제 노선 데이터가 없어 정류장 접근 시간만 센다.
// title 속성(순수 텍스트)에도 그대로 쓰므로 아이콘 없이 글자만 낸다.
const walkNote = leg => leg.walkMin ? ` · 도보 ${leg.walkMin}분 포함` : '';

// ── 표시 필터 (대분류 S.tab → 세부 S.sub) ─────────────────────
// 숙소는 sub 가 없어 등급(tier)을 세부 타입으로 쓴다.
const subKey = p => p.type === 'stay' ? p.tier : p.sub;
function subTypes() {
  const R2 = REGIONS[S.region];
  if (S.tab === 'sight') return R2.sightTypes;
  if (S.tab === 'food') return R2.foodTypes;
  if (S.tab === 'stay') return { guesthouse: { name: TIER_NAME.guesthouse, ico: 'bed-double' },
                                 motel:      { name: TIER_NAME.motel,      ico: 'bed-double' },
                                 hotel:      { name: TIER_NAME.hotel,      ico: 'hotel' } };
  return null;   // 전체 탭에는 세부 필터가 없다
}
const inFilter = p => (S.tab === 'all' || p.type === S.tab) && (!S.sub || subKey(p) === S.sub);

// 넣을 수 있는지 판단할 때 쓰는 문맥. 렌더당 한 번만 만들고 장소마다 재사용한다
// (장소마다 compute() 를 다시 돌리면 지도 드래그 프레임이 죽는다).
function blockCtx() {
  const q = S.quest; if (!q) return null;
  const day = S.day, i = insertAtDay(day), res = computeS(), rows = res.rows;
  const pr = i > 0 ? rows[i - 1] : null;
  const depart = pr && pr.poi.type !== 'stay' ? pr.end : day * 1440 + (day === 0 ? wakeOf(0) : wakeOf(day));
  return {
    q, day, depart,
    // 이 자리에 넣을 때 남아 있는 체력. 앞이 숙소면 자고 일어난 뒤라 그날의 시작값을 쓴다.
    stam: pr && pr.poi.type !== 'stay' ? pr.stam : (res.dayStat[day] || { start: q.stamina }).start,
    prev: i > 0 ? poi(S.plan[i - 1].id) : startPoint(S),
    wknd: isWeekend(dowOf(q, day)),
    dow: dowOf(q, day),
    modes: Object.keys(TRANSPORT).filter(k => !(q.banModes || []).includes(k))
  };
}

// 넣을 수 없으면 이유 문자열, 넣을 수 있으면 null.
// 가장 빠른 수단으로도 영업시간 안에 못 들어가면 불가로 본다.
function whyBlocked(p, ctx) {
  ctx = ctx || blockCtx();
  if (!ctx) return null;
  if (p.closed && p.closed.includes(ctx.dow)) return `${REGIONS[S.region].dayNames[ctx.dow]}요일 휴무`;
  if (p.type === 'stay') return null;                 // 숙소는 체크인 시각만 맞으면 됨
  // 수단별 소요·체력을 한 번에 잰다. 따로 두 번 돌면 136곳 × 5수단이 두 배가 되어
  // 렌더마다 travel() 이 1,360번 불린다(측정 0.34초) — 지도를 만질 때마다 걸린다.
  let fastest = Infinity, easiest = Infinity;
  for (const k of ctx.modes) {
    const t = travel(ctx.prev, p, k, ctx.q.people, ctx.depart, ctx.wknd);
    if (t.min < fastest) fastest = t.min;
    const d = legDrain(p, ctx, k, t);
    if (d < easiest) easiest = d;
  }
  const arrive = ctx.depart + fastest;
  const open = ctx.day * 1440 + p.open[0], close = ctx.day * 1440 + p.open[1];
  const end = Math.max(arrive, open) + p.stay;
  if (arrive > close) return `영업 종료(${hhmm(p.open[1])}) 후에야 도착`;
  if (end > close) return `영업 종료(${hhmm(p.open[1])}) 전에 못 나옴`;
  if (end > ctx.day * 1440 + 1440) return '자정을 넘김';
  // 가장 덜 지치는 수단으로도 체력이 바닥나면 넣을 수 없다.
  // 열 시간 걸어가는 구간이 여기서 걸린다 — 시간은 남아도 사람이 못 버틴다.
  if (ctx.stam != null && ctx.stam - easiest < 0) return '체력이 남지 않음';
  return null;
}
// 이 자리에 p 를 k 수단으로 넣을 때 드는 체력 — 이동 소모 + 체류 소모(식사는 회복이라 음수).
// 이미 잰 구간이 있으면 t 로 넘겨 travel() 을 다시 부르지 않는다.
function legDrain(p, ctx, k, t) {
  t = t || travel(ctx.prev, p, k, ctx.q.people, ctx.depart, ctx.wknd);
  const arrive = ctx.depart + t.min;
  const begin = Math.max(arrive, ctx.day * 1440 + p.open[0]);
  return drain(DRAIN_MOVE[k], ctx.depart, arrive, ctx.q.staminaType, true, null)
    + drain(DRAIN_STAY[p.type] * (p.type === 'food' && p.sub === 'cafe' ? .5 : 1),
            begin, begin + p.stay, ctx.q.staminaType, false, null);
}
// 지도 핀 안에 그릴 아이콘 — 색은 대분류, 아이콘은 세부 타입을 나타낸다
const pinIcon = p => p.type === 'sight' ? SUBT(p).ico
                   : p.type === 'food' ? FOODT(p).ico
                   : p.tier === 'hotel' ? 'hotel' : 'bed-double';
const wakeOf = d => d === 0 ? (arrival(S) ? arrival(S).arrive : S.startMin) : (S.wake[d] ?? DAY_START);
const poi = id => REGIONS[S.region].pois.find(p => p.id === id);
const save = () => localStorage.setItem(SAVE, JSON.stringify(
  { xp: S.xp, cleared: S.cleared, buffs: S.buffs, region: S.region, regionPicked: S.regionPicked }));

// ─────────────────────────────────────────────────────────────
// 렌더
// ─────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
// 렌더 초기 호출보다 앞서 있어야 한다 — 시트·핀 크기 등 곳곳에서 참조한다.
const isMobile = () => matchMedia('(max-width:720px)').matches;
// Lucide 아이콘 (상단 스프라이트의 symbol 을 참조). 크기·색은 CSS 로 따라간다.
const ic = (n, cls) => `<svg class="ic ${cls || ''}"><use href="#i-${n}"/></svg>`;
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// 렌더 사이클 캐시. 팬·줌은 render() 를 안 거치고 renderMap() 만 다시 그리는데,
// 그때마다 차단 판정(136곳 × 수단 5 travel(), 실측 73ms)을 다시 하면 핀치가 한 자릿수 fps 로
// 떨어진다. 판정은 일정·일차에만 의존하고 시점과 무관하므로 상태가 바뀌는 render() 에서만 비운다.
let BLK = null, RES = null;
// 한 렌더 사이클 안에서 compute 를 한 번만 돌린다. 상태를 바꾼 직후(render 전)에는
// 반드시 compute(S) 를 직접 불러야 한다 — 캐시는 render() 진입 때만 비워진다.
const computeS = () => RES || (RES = compute(S));
function render() {
  BLK = null; RES = null;
  const R = REGIONS[S.region], lv = level();
  $('#regionName').textContent = R.name;
  $('#lv').textContent = lv;
  $('#xpfill').style.width = (S.xp % 120) / 120 * 100 + '%';
  $('#xptxt').textContent = S.xp + ' XP';
  document.querySelectorAll('#filters [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const subs = subTypes();
  $('#subfilters').hidden = !subs;
  if (subs) $('#subfilters').innerHTML = `<button data-sub="" class="${S.sub ? '' : 'on'}">전체</button>`
    + Object.entries(subs).map(([k, t]) =>
        `<button data-sub="${k}" class="${S.sub === k ? 'on' : ''}">${ic(t.ico)}${esc(t.name)}</button>`).join('');
  const bn = S.buffs.filter(b => BUFFS[b]).length;
  $('#buffbtn').innerHTML = `${ic('sparkles')} 버프 ${bn}`;
  $('#buffbtn').disabled = !bn;
  if (!bn) $('#buffpop').hidden = true;
  if (!$('#buffpop').hidden) renderBuffPop();

  // 의뢰 선택 목록 (시작 화면)
  $('#quests').innerHTML = R.quests.map(q => {
    const lock = q.lv > lv, on = S.quest && S.quest.id === q.id;
    const done = S.cleared.includes(q.id) ? ' ' + ic('circle-check-big', 'ok') : '';
    return `<div class="card ${lock ? 'lock' : ''} ${on ? 'on' : ''}" data-quest="${q.id}">
      <div class="t">${esc(q.title)}${done}</div>
      <div class="s">${lock ? `${ic("lock")} Lv.${q.lv} 부터 열립니다` : esc(q.desc)}</div>
      ${lock ? '' : `<div class="s" style="margin-top:5px">${ic("wallet")} ${won(q.budget)} · ${ic("calendar-days")} ${q.days}일 · ${ic("users")} ${q.people}인 · ${ic("target")} 관광 ${q.minSights}곳+
        ${q.banModes ? ` · ${ic("ban")} ` + q.banModes.map(m => TRANSPORT[m].name).join('/') : ''}
        ${q.minStayTier ? ` · ${ic("hotel")} ` + TIER_NAME[q.minStayTier] + ' 이상' : ''}${q.endBy ? ` · ${ic("clock")} ${hhmm(q.endBy)}까지 귀가` : ''}</div>
        <div class="s" style="margin-top:3px">${ic("star")} 필수: ${q.must.map(id => esc(poi(id).name)).join(', ')}</div>
        <div class="s">${ic(ST(q).ico)} ${ST(q).name} · 체력 ${q.stamina} — ${esc(ST(q).desc)}</div>
        <div class="s">${ic('heart')} ${esc(q.age)} — ${esc(AT(q).desc)}</div>`}
    </div>`;
  }).join('');
  $('#pickclose').hidden = !S.quest;

  // 좌상단 HUD: 진행 중인 의뢰 (작게)
  const q = S.quest;
  // 떠 있는 시계: 지금 장소를 담으면 몇 일차 몇 시에 출발하는지 — 넣기 전에 시간을 가늠하게.
  const bc = q ? blockCtx() : null;
  $('#clockpop').hidden = !bc;
  // 일차는 탭이 아니라 출발 시각에서 역산한다 — 숙소로 하루를 안 닫았으면
  // 2일차 탭이어도 일정은 1일차에 이어 붙는다. 라벨이 탭을 따라가면 거짓말이 된다.
  if (bc) {
    const d = Math.floor(bc.depart / 1440);
    $('#clockpop').innerHTML =
      `${ic('clock')} ${d + 1}일차 ${dowName(R, dowOf(q, d))} · <b>${hhmm(bc.depart)}</b> 출발`;
  }
  $('#active').innerHTML = q ? `<div class="card on">
      <div class="t" style="font-size:15px">${esc(q.title)}</div>
      <div class="qline">${ic("wallet")} ${won(q.budget)} · ${ic("calendar-days")} ${q.days}일 · ${ic("users")} ${q.people}인</div>
      <div class="qline">${ic("target")} 관광 ${q.minSights}곳 · ${ic("bed-double")} 숙소 ${q.days - 1}곳${q.banModes ? ` · ${ic("ban")} ` + q.banModes.map(m => TRANSPORT[m].name).join('/') : ''}${q.minStayTier ? ` · ${ic("hotel")} ` + TIER_NAME[q.minStayTier] + ' 이상' : ''}${q.endBy ? ` · ${ic("clock")} ${hhmm(q.endBy)}까지 귀가` : ''}</div>
      <div class="qline">${ic("star")} ${q.must.map(id => esc(poi(id).name)).join(", ")}</div>
      <div class="qline" title="${esc(ST(q).desc)}">${ic(ST(q).ico)} ${ST(q).name} · 체력 ${q.stamina}</div>
      <div class="qline" title="${esc(AT(q).desc)}">${ic('heart')} ${esc(q.age)} · ${AT(q).likes.map(k => REGIONS[S.region].sightTypes[k].name).join(', ')} 선호</div>
      <button class="go" data-act="pick" style="margin-top:9px;padding:6px;font-size:13px">다른 의뢰</button>
    </div>` : `<div class="card"><span class="s">의뢰를 선택하세요</span></div>`;

  // 지도 배경 + 출처 표시. 공공데이터라 출처만 밝히면 되지만, 밝히는 건 여전히 의무다.
  const mi = R.mapImage, img = $('#mapimg');
  img.hidden = !mi;
  if (mi) { if (img.getAttribute('src') !== mi.src) img.src = mi.src; img.width = mi.vw; img.height = mi.vh; }
  $('#maphint').innerHTML = mi
    ? `행정구역 지도: ${mi.credit} <a href="${mi.sourceUrl}" target="_blank">${mi.license}</a>
       · 핀 위치는 실좌표를 투영한 근사값.`
    : '지도는 위치감을 위한 간략도 · 거리·시간은 실좌표 기준';

  const R2 = computeS();
  renderMap();
  if (S.pop) openPoi(S.pop);     // 열려 있던 팝업 내용 갱신 (포함 횟수 등)
  renderGuList();
  renderPlan(R2);
  renderSum(R2);
}

// 지도 -------------------------------------------------------
// 실제 지도 이미지가 있으면 그 캔버스·범위를 쓰고, 없으면 좌표만으로 생성한 약도를 쓴다.
const mapBox = () => {
  const m = REGIONS[S.region].mapImage;
  return m ? { vw: m.vw, vh: m.vh, b: m.bounds } : { vw: 700, vh: 800, b: REGIONS[S.region].bounds };
};
// 위경도 → 화면 픽셀. 배율·이동이 이미 반영된 값이라 SVG 를 따로 확대할 필요가 없다.
function px(p) {
  const { vw, vh, b } = mapBox();
  return [(p.lng - b.w) / (b.e - b.w) * vw * V.k + V.tx,
          (b.n - p.lat) / (b.n - b.s) * vh * V.k + V.ty];
}

// 겹침을 푼 뒤의 핀 화면 좌표. renderMap 이 채우고 경로선·팝업이 같이 참조한다.
const PIN = new Map();

// 원이 서로 겹치지 않게 밀어낸다. 실제 위치에서 최대 MAXPUSH 픽셀까지만 어긋나고,
// 확대할수록 원래 간격이 벌어지므로 밀어낼 일도 저절로 사라진다.
const MAXPUSH = 46;
function layoutPins(list, radiusOf) {
  const a = list.map((p, i) => { const [x, y] = px(p); return { p, i, x, y, ox: x, oy: y, r: radiusOf(p) }; });
  for (let pass = 0; pass < 60; pass++) {
    let moved = false;
    for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) {
      const A = a[i], B = a[j], need = A.r + B.r + 4;
      let dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
      if (d >= need) continue;
      if (d < 0.01) { dx = Math.cos(i * 2.399); dy = Math.sin(i * 2.399); d = 1; }  // 좌표가 똑같을 때
      const k = (need - d) / 2 / d;
      A.x -= dx * k; A.y -= dy * k; B.x += dx * k; B.y += dy * k;
      moved = true;
    }
    if (!moved) break;
  }
  // 원래 위치에서 너무 멀어지지 않게 잡아둔다
  a.forEach(o => {
    const dx = o.x - o.ox, dy = o.y - o.oy, d = Math.hypot(dx, dy);
    if (d > MAXPUSH) { o.x = o.ox + dx / d * MAXPUSH; o.y = o.oy + dy / d * MAXPUSH; }
  });
  return a;
}
// ── 확대/이동 ───────────────────────────────────────────────
// k=배율, tx/ty=화면 오프셋. 지도 이미지와 핀 SVG 를 감싼 컨테이너에 한 번만 적용한다.
const V = { k: 0, tx: 0, ty: 0, auto: true };
const ZMIN = 0.4, ZMAX = 8;

// pointermove 는 초당 수백 번 온다 — 핀을 프레임당 한 번만 다시 그린다.
// 지형 transform 은 즉시 반영해 손을 따라가고, 핀·글자만 rAF 로 합친다.
let mapRaf = 0;
function applyView() {
  $('#mapcanvas').style.transform = `translate(${V.tx}px,${V.ty}px) scale(${V.k})`;
  $('#zoomtxt').textContent = Math.round(V.k * 100) + '%';
  if (!mapRaf) mapRaf = requestAnimationFrame(() => { mapRaf = 0; renderMap(); });
}
function fitView() {
  const { vw, vh } = mapBox(), r = $('#mapwrap').getBoundingClientRect();
  V.k = Math.min(r.width / vw, r.height / vh) * 0.98;
  V.tx = (r.width - vw * V.k) / 2;
  V.ty = (r.height - vh * V.k) / 2;
  V.auto = true;
  applyView();
}
// (mx,my) 화면 좌표를 고정한 채 배율만 바꾼다
function zoomAt(mx, my, f) {
  const k2 = Math.min(ZMAX, Math.max(ZMIN, V.k * f));
  if (k2 === V.k) return;
  V.tx = mx - (mx - V.tx) * k2 / V.k;
  V.ty = my - (my - V.ty) * k2 / V.k;
  V.k = k2; V.auto = false;
  closePoi();              // 팝업은 핀 위치에 붙어 있으므로 배율이 바뀌면 닫는다
  applyView();
}
// 배율을 절대값으로 맞춘다 — 핀치는 시작 배율 대비 비율로 오므로 누적 오차가 없다.
const zoomTo = (k, mx, my) => zoomAt(mx, my, k / V.k);

function renderMap() {
  const R = REGIONS[S.region], lv = level(), { vw, vh } = mapBox();
  if (!V.k) { fitView(); return; }          // 첫 렌더는 화면에 맞춤
  const svg = $('#map'), rc = $('#mapwrap').getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${rc.width} ${rc.height}`);   // SVG 1단위 = 화면 1픽셀
  $('#mapcanvas').style.width = vw + 'px';
  $('#mapcanvas').style.height = vh + 'px';

  let g = '';

  if (R.mapImage) {
    // 지명은 이미지에서 떼어내 여기서 그린다 — 화면 좌표라 확대해도 늘어나지 않는다
    (R.mapImage.labels || []).forEach(l => {
      const [x, y] = px(l), sea = l.kind === 'sea';
      g += `<text x="${x}" y="${y}" text-anchor="middle" ${sea ? '' : `data-gu="${esc(l.n)}"`}
        font-size="${sea ? 16 : 18}" font-weight="${sea ? 400 : 600}" letter-spacing="${sea ? 4 : 0}"
        fill="${sea ? '#7b8d99' : (S.gu === l.n ? '#1a7fd4' : '#2f3b47')}" stroke="#fff" stroke-width="${sea ? 3 : 4}"
        paint-order="stroke" stroke-linejoin="round" opacity="${sea ? .85 : 1}"
        >${esc(l.n)}${sea ? '' : ''}<title>${esc(l.n)}의 장소 보기</title></text>`;
    });
  } else {
    const poly = pts => pts.map(([lng, lat]) => px({ lng, lat }).join(',')).join(' ');
    g += `<rect width="${rc.width}" height="${rc.height}" fill="#cfdde3"/>`;
    // land 는 지역마다 손으로 그려 넣는 데이터라 없는 게 정상이다.
    // 없다고 여기서 터지면 뒤의 핀·이름표가 통째로 안 그려진다(지도가 빈 채로 남는다).
    if (R.land) g += `<polygon points="${poly(R.land)}" fill="#ffffff" stroke="#b6c4ce" stroke-width="1.5"/>`;
    else {
      // 윤곽이 없으면 장소가 퍼져 있는 만큼만 옅게 깔아 "여기가 무대" 임을 보인다.
      const xs = R.pois.map(q => px(q));
      const x1 = Math.min(...xs.map(v => v[0])), x2 = Math.max(...xs.map(v => v[0]));
      const y1 = Math.min(...xs.map(v => v[1])), y2 = Math.max(...xs.map(v => v[1]));
      const m = 46;
      g += `<rect x="${x1 - m}" y="${y1 - m}" width="${x2 - x1 + m * 2}" height="${y2 - y1 + m * 2}"
             rx="28" fill="#ffffff" stroke="#b6c4ce" stroke-width="1.5"/>`;
    }
    (R.islands || []).forEach(i => g += `<polygon points="${poly(i)}" fill="#ffffff" stroke="#b6c4ce" stroke-width="1.5"/>`);
    (R.labels || []).forEach(l => { const [x, y] = px(l); g += `<text x="${x}" y="${y}" font-size="13" text-anchor="middle" fill="#7b8d99" letter-spacing="2">${l.n}</text>`; });
  }

  // 밝은 실제 지도 위에서는 글자를 어둡게 + 흰 테두리로 띄운다
  const light = !!R.mapImage;
  const ink = light ? '#12202e' : '#2f3b47', halo = light ? '#fff' : '#fff';
  const lbl = (x, y, t, size, weight) =>
    `<text x="${x}" y="${y}" font-size="${size}" font-weight="${weight || 500}" text-anchor="middle"
       fill="${ink}" stroke="${halo}" stroke-width="4" paint-order="stroke" stroke-linejoin="round">${t}</text>`;

  const order = new Map();
  S.plan.forEach((e, i) => { if (!order.has(e.id)) order.set(e.id, i + 1); });

  // 원 크기 — 일정에 담긴 곳은 더 크게. 겹치면 서로 밀어내 자리를 잡는다.
  // 넣을 수 없는 장소를 한 번에 계산해 지도·목록·팝업이 같은 판단을 쓴다
  if (!BLK) {
    BLK = {};
    const bctx = blockCtx();
    if (bctx) R.pois.forEach(p => { const w = whyBlocked(p, bctx); if (w) BLK[p.id] = w; });
  }
  const blocked = BLK;
  // 폰에서는 핀이 곧 버튼이다 — 담긴 곳 지름 44px(권장 최소), 나머지도 32px 은 준다
  const R_ON = isMobile() ? 22 : 18, R_OFF = isMobile() ? 16 : 13;
  const radiusOf = p => order.has(p.id) ? R_ON : R_OFF;
  const shown = R.pois.filter(p => inFilter(p) || order.has(p.id));
  PIN.clear();
  // 핀 충돌 완화(13.8ms)는 줌·필터·일정이 같으면 결과가 평행이동뿐이다 —
  // 팬 중에는 이전 배치를 밀어서 재사용하고, 키가 바뀔 때만 다시 푼다.
  const mkey = `${S.region}|${V.k}|${S.tab}|${S.sub || ''}|${S.gu || ''}|${lv}|${S.plan.map(e => e.id).join(',')}`;
  let laid;
  if (renderMap._c && renderMap._c.key === mkey) {
    const c = renderMap._c, dx = V.tx - c.tx, dy = V.ty - c.ty;
    laid = c.laid.map(o => ({ p: o.p, x: o.x + dx, y: o.y + dy }));
  } else {
    laid = layoutPins(shown, radiusOf);
    renderMap._c = { key: mkey, tx: V.tx, ty: V.ty, laid };
  }
  laid.forEach(o => PIN.set(o.p.id, [o.x, o.y]));
  const at = p => PIN.get(p.id) || px(p);

  // 경로 — 밀려난 뒤의 핀 위치를 이어야 선과 원이 맞는다
  const home = startPoint(S);
  if (S.plan.length) {
    const pts = [px(home), ...S.plan.map(e => at(poi(e.id)))];
    // 방금 담았으면 그 구간만 떼어 자라나게 그린다. 나머지는 종전대로 한 번에.
    const grow = justAdded && S.sel === S.plan.length - 1 && pts.length >= 2;
    const head = grow ? pts.slice(0, -1) : pts;
    const poly = (p2, stroke, w) =>
      p2.length < 2 ? '' : `<polyline points="${p2.map(q => q.join(',')).join(' ')}" fill="none"
        stroke-dasharray="7 5" stroke="${stroke}" stroke-width="${w}" opacity=".95"/>`;
    if (light) g += poly(head, '#fff', 7);
    g += poly(head, '#2a5fd0', 3);
    if (grow) {
      const [ax, ay] = pts[pts.length - 2], [bx, by] = pts[pts.length - 1];
      const seg = [pts[pts.length - 2], pts[pts.length - 1]];
      // 선을 따라 회전시킨 clip 을 출발점에서부터 늘려 그려지는 것처럼 보이게 한다.
      const len = Math.hypot(bx - ax, by - ay) || 1;
      const deg = Math.atan2(by - ay, bx - ax) * 180 / Math.PI;
      g += `<clipPath id="legclip" class="legclip">
        <rect x="${ax}" y="${ay - 8}" width="${len}" height="16" style="--deg:${deg.toFixed(2)}deg"/>
      </clipPath>
      <g clip-path="url(#legclip)">${light ? poly(seg, '#fff', 7) : ''}${poly(seg, '#2a5fd0', 3)}</g>`;
    }
  }
  // 시작·종료 지점. 장소 핀에 묻히면 안 되므로 문자열을 따로 모아 맨 나중에 그린다.
  let marks = '';
  R.starts.forEach(s => {
    const [x, y] = px(s), on = s.id === home.id;
    const r = on ? 9 : 6;
    marks += `<g data-start="${s.id}" style="cursor:pointer">
      <title>${esc(s.name)} (${s.note})${on ? ' — 출발·귀가 지점' : ''}</title>
      ${on ? `<circle cx="${x}" cy="${y}" r="${r + 7}" fill="#fff" opacity=".75"/>` : ''}
      <rect x="${x - r}" y="${y - r}" width="${r * 2}" height="${r * 2}" rx="2"
        fill="${on ? '#e5484d' : '#8fa3b3'}" stroke="${halo}" stroke-width="3" transform="rotate(45 ${x} ${y})"/>
      ${on ? `<circle cx="${x}" cy="${y}" r="2.6" fill="#fff"/>` : ''}
    </g>`;
  });

  // 이름표 겹침 방지: 이미 놓인 이름표와 부딪히면 아래로 밀고, 그래도 안 되면 이름을 숨긴다.
  // 일정에 담긴 곳은 항상 보여야 하므로 먼저 자리를 잡는다.
  const FS = 13;                                    // 이름표 글자 크기(화면 px)
  const placed = [];
  const place = (x, y, name, base) => {
    const w = name.length * FS + 10, h = FS + 3;    // 화면 픽셀 기준 대략적인 글상자
    let sy = y + base;
    for (let i = 0; i < 5; i++) {
      if (!placed.some(b => Math.abs(b.x - x) < (b.w + w) / 2 && Math.abs(b.y - sy) < h)) {
        placed.push({ x, y: sy, w }); return sy;
      }
      sy += h + 2;
    }
    return null;                                    // 다섯 번 밀어도 자리가 없으면 포기
  };

  // 구 이름이 이미 차지한 자리를 먼저 등록해 두면 장소 이름표가 그 위에 겹치지 않는다
  (R.mapImage ? R.mapImage.labels || [] : []).forEach(l => {
    const [x, y] = px(l), fs = l.kind === 'sea' ? 16 : 18;
    placed.push({ x, y, w: l.n.length * fs + 10 });
  });

  // 핀과 이름표를 나눠 그린다 — 한 그룹에 같이 두면 나중에 그려진 핀이 앞 이름표를 덮는다
  let pins = '', names = '';
  // 출발·귀가 지점 이름표가 우선권을 갖도록 장소들보다 먼저 자리를 잡는다
  {
    const [hx, hy] = px(home), hy2 = place(hx, hy, home.name, 24);
    if (hy2 !== null) names += `<g data-start="${home.id}" style="cursor:pointer">${lbl(hx, hy2, esc(home.name), 14, 800)}</g>`;
  }
  [...shown].sort((a, b) => (order.has(b.id) ? 1 : 0) - (order.has(a.id) ? 1 : 0)).forEach(p => {
    const [x, y] = at(p), n = order.get(p.id), r = radiusOf(p);
    const shut = !!blocked[p.id];    // 넣을 수 없으면 색을 빼고 클릭도 막는다
    const col = shut ? '#9aa7b4' : { sight: '#3d7dff', food: '#ff8a3d', stay: '#a55cff' }[p.type];
    const tag = `data-poi="${p.id}" style="cursor:${shut ? 'not-allowed' : 'pointer'}" opacity="${shut ? .32 : 1}"`;
    const sel = S.pop === p.id;

    const isz = r * 1.15;                        // 원 안에 들어갈 아이콘 크기
    pins += `<g ${tag} class="pin${sel ? ' sel' : ''}">
      <title>${esc(p.name)} — ${p.type === 'sight' ? SUBT(p).name : p.type === 'food' ? FOODT(p).name : TIER_NAME[p.tier] + (p.star ? ' ' + p.star + '성' : '')}</title>
      ${sel ? `<circle class="ring" cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${col}" stroke-width="3"/>` : ''}
      <circle class="dot" cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="${halo}" stroke-width="3"/>
      <use href="#i-${pinIcon(p)}" x="${x - isz / 2}" y="${y - isz / 2}" width="${isz}" height="${isz}"
           fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>
      ${n ? `<circle cx="${x + r * .78}" cy="${y - r * .78}" r="8.5" fill="#fff" stroke="${col}" stroke-width="2"/>
             <text x="${x + r * .78}" y="${y - r * .78 + 3.6}" font-size="11" font-weight="700" fill="${col}"
                   text-anchor="middle" pointer-events="none">${n}</text>` : ''}
    </g>`;

    const ly = (n || S.tab !== 'all') ? place(x, y, p.name, r + 16) : null;
    if (ly !== null) names += `<g ${tag}>${lbl(x, ly, esc(p.name), FS, n ? 700 : 500)}</g>`;
  });
  g += pins + marks + names;   // 시작지점은 핀 위, 이름표는 그 위
  svg.innerHTML = g;
}

// 귀가 교통수단 선택 -------------------------------------------
function openReturn() {
  const q = S.quest; if (!q || !S.plan.length) return;
  const res = compute(S), last = res.rows[res.rows.length - 1];
  const from = last.poi, home = startPoint(S), ban = q.banModes || [];
  const depart = last.end, wknd = isWeekend(dowOf(q, q.days - 1));
  closePoi();
  $('#movehd').innerHTML = `${ic('flag')} ${esc(home.name)} 으로 돌아가기`;
  $('#movesub').textContent = `${from.name} → ${home.name} · ${hhmm(depart)} 출발 · 마지막 일정`;
  $('#moveopts').innerHTML = Object.entries(TRANSPORT).map(([k, t]) => {
    const banned = ban.includes(k);
    const leg = travel(from, home, k, q.people, depart, wknd);
    let fare = leg.cost;
    if (hasBuff('taxicoupon') && k === 'taxi') fare = Math.max(0, fare - 4800 * Math.ceil(q.people / 4));
    return `<div class="card ${banned ? 'lock' : ''} ${S.ret && S.ret.mode === k ? 'on' : ''}" ${banned ? '' : `data-ret="${k}"`}>
      <div class="t">${ic(t.ico, 'big')} ${t.name}${banned ? ' — 이 의뢰는 이용 불가' : ''}</div>
      <div class="s" style="margin-top:4px">${leg.min}분${leg.rush ? ` <b style="color:var(--warn)">(정체 +${leg.min - leg.base}분)</b>` : ''} · ${won(fare)}${walkNote(leg)} · ${hhmm(depart + leg.min)} 도착</div>
    </div>`;
  }).join('');
  $('#move').showModal();
}

// 구간 교통수단 선택 ------------------------------------------
// 넣을 자리 바로 앞 장소에서 이 장소까지의 실제 소요·요금·체력을 비교해 고른다.
function openMove(id) {
  const q = S.quest; if (!q || whyBlocked(poi(id))) return;
  const p = poi(id), i = insertAtDay(S.day);
  const from = i > 0 ? poi(S.plan[i - 1].id) : startPoint(S);
  const ban = q.banModes || [];
  // 앞 일정이 끝나는 시각에 출발한다 — 그래야 출퇴근 정체가 제대로 반영된다
  const rows = compute(S).rows, pr = i > 0 ? rows[i - 1] : null;
  const depart = pr && pr.poi.type !== 'stay' ? pr.end : wakeOf(S.day);
  closePoi();

  $('#movehd').innerHTML = `${ic('arrow-right')} ${esc(p.name)} 까지 무엇을 타고 갈까요?`;
  $('#movesub').textContent = `${from.name} → ${p.name} · ${hhmm(depart)} 출발 · ${S.day + 1}일차 ${i + 1}번째 일정`;
  const ctx = blockCtx();
  $('#moveopts').innerHTML = Object.entries(TRANSPORT).map(([k, t]) => {
    // 그 수단으로 가면 체력이 바닥나는 경우도 금지 수단과 똑같이 못 고르게 막는다
    const tired = ctx && ctx.stam - legDrain(p, ctx, k) < 0;
    const banned = ban.includes(k) || tired;
    const leg = travel(from, p, k, q.people, depart);
    let fare = leg.cost;
    if (hasBuff('taxicoupon') && k === 'taxi') fare = Math.max(0, fare - 4800 * Math.ceil(q.people / 4));
    const st = drain(DRAIN_MOVE[k], 0, leg.min, q.staminaType, true, hasBuff);
    return `<div class="card ${banned ? 'lock' : ''}" ${banned ? '' : `data-move="${k}" data-poi2="${id}"`}>
      <div class="t">${ic(t.ico, 'big')} ${t.name}${
        ban.includes(k) ? ' — 이 의뢰는 이용 불가' : tired ? ' — 체력이 남지 않음' : ''}</div>
      <div class="s" style="margin-top:4px">${leg.min}분${leg.rush ? ` <b style="color:var(--warn)">(정체 +${leg.min - leg.base}분)</b>` : ''} · ${leg.km.toFixed(1)}km · ${won(fare)}${k === 'car' ? ' + 일 대여료' : ''}${walkNote(leg)}</div>
      <div class="s">체력 -${st.toFixed(1)}</div>
    </div>`;
  }).join('');
  $('#move').showModal();
}

// 도착 교통편 선택 ------------------------------------------
// 의뢰를 맡으면 먼저 손님의 편지를 보여준다. 조건은 의뢰 데이터에서 그대로 만든다 —
// 숫자를 편지에 손으로 옮겨 적으면 밸런스를 조정할 때마다 편지가 거짓말을 하게 된다.
function letterBody(q) {
  const R = REGIONS[S.region];
  const li = (ico, txt) => `<li>${ic(ico)}<span>${txt}</span></li>`;
  return `<div class="paper">
      <p>여행설계사님께,</p>
      <p>${esc(q.desc)}</p>
      <p>저희는 ${esc(AT(q).desc)}. 잘 부탁드립니다.</p>
      <p class="sign">${esc(q.from)}에서, ${esc(q.age)} 손님 드림</p>
    </div>
    <ul class="need">
      ${li('calendar-days', `<b>${q.days}일</b> 일정 · ${dowName(R, q.startDow)}요일 출발 · ${ic('users')} ${q.people}인`)}
      ${li('wallet', `예산 <b>${won(q.budget)}</b> — ${esc(R.name)}까지 오는 교통비도 여기서 나갑니다`)}
      ${li('star', `<span class="must">꼭 가야 할 곳: <b>${q.must.map(id => esc(poi(id).name)).join(', ')}</b></span>`)}
      ${li('target', `관광지 <b>${q.minSights}곳</b> 이상`)}
      ${q.days > 1 ? li('bed-double', `숙소 <b>${q.days - 1}곳</b>${q.minStayTier ? ` · ${TIER_NAME[q.minStayTier]} 이상` : ''}`) : ''}
      ${q.banModes ? li('ban', `<b>${q.banModes.map(m => TRANSPORT[m].name).join('·')}</b>는 타지 않습니다`) : ''}
      ${q.endBy ? li('clock', `마지막 날 <b>${hhmm(q.endBy)}</b>까지 출발지로 돌아와야 합니다`) : ''}
      ${li(ST(q).ico, `${ST(q).name} · 체력 ${q.stamina} — ${esc(ST(q).desc)}`)}
    </ul>`;
}

function openLetter(q) {
  $('#lethd').innerHTML = `${ic('mail', 'big')} ${esc(q.from)}에서 온 편지`;
  $('#letbody').innerHTML = letterBody(q);
  $('#letgo').innerHTML = `${ic('check')} 맡겠습니다`;
  $('#letter').showModal();
}

// 교통편을 고른 뒤 렌터카를 빌릴지 묻는다. 요금 규칙은 그대로다(쓰는 날만 일 대여료) —
// 이 선택은 장소를 담을 때의 기본 이동수단만 정한다. 물을 이유가 없는 경우는 조용히 넘어간다.
function openRent() {
  const q = S.quest, arr = arrival(S);
  if (!q || S.defMode) return;
  if ((q.banModes || []).includes('car')) { S.defMode = 'bus'; return; }   // 렌터카 금지 의뢰
  if (arr && arr.per === 'car') { S.defMode = 'car'; return; }             // 자차로 왔으면 이미 차가 있다
  $('#rentsub').textContent = `하루 ${won(CAR_DAILY)} — 렌터카를 쓴 날만 부과됩니다. 지금 정해도 구간마다 수단은 바꿀 수 있어요.`;
  $('#rentopts').innerHTML = `
    <div class="card" data-rent="yes">
      <div class="t">${ic('car', 'big')} 빌린다</div>
      <div class="s" style="margin-top:4px">기본 이동수단이 렌터카가 됩니다. 문 앞까지 가서 덜 지치지만, 주차 대기가 있고 출퇴근 정체를 받습니다.</div>
    </div>
    <div class="card" data-rent="no">
      <div class="t">${ic('bus', 'big')} 괜찮다, 대중교통으로</div>
      <div class="s" style="margin-top:4px">기본 이동수단이 버스가 됩니다. 나중에 구간에서 렌터카를 골라도 그날 대여료만 붙습니다.</div>
    </div>`;
  $('#rentcar').showModal();
}

// 인원(자차는 대수)을 곱한 총액
const partyOf = (q, o) => o.per === 'car' ? Math.ceil(q.people / 4) : q.people;
const durText = m => (m >= 60 ? `${Math.floor(m / 60)}시간 ` : '') + (m % 60 ? `${m % 60}분` : '');

function openTrip() {
  const q = S.quest; if (!q) return;
  const R = REGIONS[S.region];
  const opts = R.origins[q.from] || [], starts = R.starts;
  $('#triphd').innerHTML = `${ic('map-pin')} ${esc(q.from)}에서 ${esc(R.name)}까지, 무엇을 타고 올까요?`;
  $('#tripsub').textContent = `${R.name}까지 오는 비용도 손님 예산에서 나갑니다. 수단을 고르면 예매 화면에서 시간대를 정합니다.`;
  $('#tripopts').innerHTML = opts.map(o => {
    const to = starts.find(x => x.id === o.to), party = partyOf(q, o);
    const ts = tripsOf(R, o);
    const lo = Math.min(...ts.map(t => t.fare)) * party, hi = Math.max(...ts.map(t => t.fare)) * party;
    const cb = o.per === 'car' ? carBill(R, o, null) : null;
    const bnm = brandOf(o).nm;
    return `<div class="card ${o.id === S.arriveId ? 'on' : ''}" data-trip="${o.id}">
      <div class="t">${ic(o.ico, 'big')} ${esc(o.name)}${bnm === o.name ? '' : ` <span class="s">${esc(bnm)}</span>`}</div>
      <div class="s" style="margin-top:5px">
        ${esc(to.name)}까지 ${durText(o.min)} · ${hhmm(ts[0].arrive)}~${hhmm(ts.at(-1).arrive)} 도착편 ${ts.length}편</div>
      <div class="s">${lo === hi ? won(lo) : `${won(lo)} ~ ${won(hi)}`} · 예산의 ${Math.round(lo / q.budget * 100)}~${Math.round(hi / q.budget * 100)}%${
        cb ? ` (유류비 ${won(cb.fuel)} + 통행료 ${won(cb.toll)}${party > 1 ? ` × ${party}대` : ''}) · 여행 중 렌터카비 없음`
           : ` (1인 ${won(Math.min(...ts.map(t => t.fare)))}~${won(Math.max(...ts.map(t => t.fare)))} × ${q.people}인)`}</div>
    </div>`;
  }).join('');
  $('#trip').showModal();
}

// ── 예매 화면 ────────────────────────────────────────────────
// 지금 보고 있는 시간대 탭. 창을 다시 열면 이미 끊은 편의 시간대로 맞춘다.
let bookSlot = 0;
function openBook() {
  const q = S.quest, R = REGIONS[S.region];
  const o = (R.origins[q.from] || []).find(x => x.id === S.arriveId);
  if (!q || !o) { openTrip(); return; }
  const ts = tripsOf(R, o);
  const cur = S.depMin != null && ts.find(t => t.dep === S.depMin);
  bookSlot = cur ? cur.si : ts[0].si;
  renderBook();
  if (!$('#book').open) $('#book').showModal();
}
function renderBook() {
  const q = S.quest, R = REGIONS[S.region];
  const o = (R.origins[q.from] || []).find(x => x.id === S.arriveId);
  if (!q || !o) return;
  const b = brandOf(o), party = partyOf(q, o), ts = tripsOf(R, o);
  const to = R.starts.find(x => x.id === o.to);
  const isCar = o.per === 'car';
  $('#bookbrand').innerHTML = `${ic(o.ico, 'big')}<span class="bnm">${esc(b.nm)}</span>
    <span class="s">${esc(b.sub)}</span><span class="btag">${esc(b.tag)}</span>`;
  $('#bookhd').innerHTML = `${esc(q.from)} ${ic('arrow-right')} ${esc(to.name)}`;
  $('#booksub').textContent = `${q.people}인${isCar ? ` · 차 ${party}대` : ''} · 편도 ${durText(o.min)}`
    + ` · ${dowName(R, q.startDow)}요일 출발`;
  // 시간대 탭. 편이 하나도 없는 시간대는 눌리지 않게 둔다(자정 넘겨 닿는 편은 팔지 않는다).
  $('#bookslots').innerHTML = SLOTS.map((s, i) => {
    // 값은 그 시간대에 실제로 있는 편에서 뽑는다 — 손으로 적어 둔 편(deps)은 배수를 안 따른다.
    const inSlot = ts.filter(t => t.si === i);
    return `<button data-slot="${i}" class="${i === bookSlot ? 'on' : ''}" ${inSlot.length ? '' : 'disabled'}>
      ${ic(s.ico)} ${s.name}<span class="pr">${inSlot.length
        ? won(Math.min(...inSlot.map(t => t.fare)) * party) : '편성 없음'}</span></button>`;
  }).join('');
  $('#booknote').innerHTML = `<div class="booknote">${ic(isCar ? 'fuel' : 'ticket')}<span>${isCar
    ? `유류비는 ${o.km}km ÷ ${(R.fuel || FUEL).kmpl}km/L × ${won((R.fuel || FUEL).price)}/L 로 계산합니다. `
      + `통행료는 편도 ${won(o.toll || 0)}이고 <b>0시~5시 출발이면 심야할인 50%</b>가 붙습니다.`
    : o.deps ? '하루 몇 편 없는 노선이라 시간대를 골라 끊는 대신 있는 편에 맞춰야 합니다.'
    : '늦게 떠나는 편일수록 쌉니다(저녁 &lt; 오후 &lt; 오전 &lt; 새벽). '
      + '대신 늦게 도착한 만큼 첫날 일정이 짧아집니다.'}</span></div>`;
  $('#booklist').innerHTML = ts.filter(t => t.si === bookSlot).map(t => {
    const total = t.fare * party, cb = isCar ? carBill(R, o, t.dep) : null;

      <div class="trip">
        <span class="no">${esc(t.no)}</span>

      </div>
      <div class="s" style="margin-top:5px">${cb
        ? `${ic('fuel')} 유류비 ${won(cb.fuel * party)} + ${ic('receipt')} 통행료 ${won(cb.toll * party)}`
          + (cb.night ? ` <b class="cheap">심야할인</b>` : '')

}

// 장소를 넣을 때마다 손님이 한마디 한다. 상황(선호·체력·예산)에 맞춰 고른다.
const LINES = {
  fav:    ['여기 꼭 가보고 싶었어요!', '오, 딱 제 취향이에요', '이런 곳 좋아해요'],
  tired:  ['조금 쉬었다 가면 안 될까요…', '다리가 좀 아픈데요', '오늘 무리하는 것 같아요'],
  broke:  ['돈이 꽤 나가는데 괜찮을까요?', '예산이 슬슬 걱정돼요'],
  meal:   ['배고팠어요!', '맛있겠다', '여기 유명한 데죠?'],
  cafe:   ['커피 한 잔 좋죠', '잠깐 앉았다 가요'],
  stay:   ['오늘은 여기서 묵는군요', '짐 좀 풀고 싶었어요'],
  ok:     ['좋아요', '괜찮네요', '네, 넣어주세요']
};
const pick = a => a[Math.floor(Math.random() * a.length)];
// 화면 위쪽에 잠깐 떴다 사라지는 토스트. 연달아 넣으면 아래로 쌓인다.
function say(mood, text) {
  const q = S.quest; if (!q) return;
  const el = document.createElement('div');
  el.className = 'toast ' + mood;
  el.innerHTML = `${ic(AT(q).ico || 'heart')}<span>${esc(text || pick(LINES[mood] || LINES.ok))}</span>`;
  const box = $('#toasts');
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();      // 너무 쌓이지 않게
  el.addEventListener('animationend', e => { if (e.animationName === 'toastout') el.remove(); });
}

// 넣은 장소와 그 시점의 상태를 보고 반응을 정한다
function reactTo(p, res) {
  const st = res.dayStat[S.day];
  if (st && st.low < st.cap * .25) return 'tired';
  if (S.quest && res.spend > S.quest.budget * .85) return 'broke';
  if (likesSub(S.quest, p)) return 'fav';
  if (p.type === 'food') return p.sub === 'cafe' ? 'cafe' : 'meal';
  if (p.type === 'stay') return 'stay';
  return 'ok';
}

// 숫자가 바뀌면 굴러가며 색으로 방향을 알린다
const PREV = {};
function countTo(el, key, to, fmt, goodIsDown) {
  if (!el) return;                   // 표시 항목이 빠져도 render() 전체가 죽지는 않게
  const from = PREV[key];
  PREV[key] = to;
  el.textContent = fmt(to);          // 값은 항상 먼저 확정 — 프레임이 안 돌아도 숫자는 맞다
  if (from == null || from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const worse = goodIsDown ? to > from : to < from;
  el.classList.add(worse ? 'worse' : 'better');
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 420), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(Math.round(from + (to - from) * e));
    if (k < 1) requestAnimationFrame(step);
    else setTimeout(() => el.classList.remove('worse', 'better'), 320);
  };
  requestAnimationFrame(step);
}

                 else this.closest('.shotwrap').remove()">
      ${cr ? `<div class="cred">© ${esc(cr.by)} · <a href="${esc(cr.src)}" target="_blank">${esc(cr.lic)}</a></div>` : ''}
    </div>
    <div class="hd">
      <h4>${must ? ic("star") + " " : ""}${esc(p.name)}</h4>

      + `<br>${ic('moon')} ${TIER_NAME[p.tier]} — 수면 회복 ${SLEEP_TIER[p.tier] >= 1 ? '+' : ''}${Math.round((SLEEP_TIER[p.tier] - 1) * 100)}%` : ''}<br>${ic("smile")} ${joyTag(p.joy)}${n ? `<br><b style="color:var(--acc)">일정에 ${n}회 포함됨</b>` : ''}</div>

      ? `<div class="kv" style="color:var(--bad)">${ic('circle-alert')} ${S.day + 1}일차에 넣을 수 없습니다 — ${esc(blockReason)}</div>`

// 일정표: 시간 비례 타임라인 -----------------------------------
let justAdded = false;     // 방금 담긴 블록에만 등장 연출을 준다
// 되돌릴 수 없는 동작은 딤 팝업으로 한 번 확인받는다
let askCb = null, askNoCb = null;
function ask(title, msg, yes, cb, noCb) {

  $('#askmsg').textContent = msg;
  $('#askyes').textContent = yes;

// 그날의 장소만 비운다. 그날을 마감하는 숙소는 남겨 다음 일차가 밀리지 않게 한다.
function resetDay(d) {
  const rows = compute(S).rows.filter(r => r.day === d);
  const keep = rows.length && rows[rows.length - 1].poi.type === 'stay' ? rows[rows.length - 1].i : -1;
  const drop = new Set(rows.map(r => r.i).filter(i => i !== keep));
  S.plan = S.plan.filter((_, i) => !drop.has(i));
  S.sel = null; S.pop = null;
  if (!S.plan.length) S.ret = null;
  render();
  $('#plan').scrollTop = 0;
}
const PPM = 0.85;          // 1분당 픽셀. 90분 체류 = 77px
const MINBLK = 16;         // 너무 짧아 안 보이는 블록의 최소 높이

function renderPlan(res) {
  const box = $('#plan');
  if (!S.quest) { box.innerHTML = `<div class="empty">왼쪽에서 의뢰를 먼저 선택하세요.</div>`; $('#editpop').hidden = true; return; }

  const arr = arrival(S), bk = arr && arr.dep != null ? arr : null;   // dep 이 있으면 예매를 마친 편이다
  // 일차 탭 — 여러 날을 세로로 이어붙이면 스크롤이 길어져서 하루씩 본다
  const days = S.quest.days;
  if (S.day >= days) S.day = days - 1;
  $('#daytabs').innerHTML = days < 2 ? '' : Array.from({ length: days }, (_, d) => {
    const rows = res.rows.filter(r => r.day === d);
    const bad = rows.some(r => r.errs.length);
    return `<button data-day="${d}" class="${d === S.day ? 'on' : ''}">
      ${d + 1}일차<span class="dw">${dowName(REGIONS[S.region], dowOf(S.quest, d))}</span>${rows.length ? ` <b>${rows.length}</b>` : ''}${bad ? ic("triangle-alert") : ""}</button>`;
  }).join('');

  // 그날의 체력 상태와 기상 시각 — 타임라인 바로 위에 함께 둔다
  const st = res.dayStat[S.day];
  const T = REGIONS[S.region].staminaTypes[res.type];
  $('#stambar').innerHTML = st ? `<div class="wakerow" style="margin-top:0">${S.day === 0
      ? `<span class="s">${ic(arr ? arr.ico : 'map-pin')} ${bk
            ? `${esc(bk.no)} · ${hhmm(bk.dep)} 출발 → ${hhmm(bk.arrive)} 도착`
            : `${hhmm(wakeOf(0))} ${esc(REGIONS[S.region].name)} 도착`}</span>
         <button class="mini" data-act="book">${bk ? '예매 변경' : '예매하기'}</button>`
      : `<span class="s">${ic('sunrise')} 체크아웃</span>
         <select data-wake="${S.day}">${[...Array(15)].map((_, i) => {
           const m = 300 + i * 30;
           return `<option value="${m}" ${m === wakeOf(S.day) ? 'selected' : ''}>${hhmm(m)}</option>`;
         }).join('')}</select>
         `}
      <span class="grow"></span>
      ${res.rows.some(r => r.day === S.day)
        ? `<button class="mini danger" data-reset="${S.day}">비우기</button>`
        : ''}
    </div>
    ${st.sleep != null ? `<div class="s sleepnote">수면 ${Math.floor(st.sleep / 60)}시간 ${st.sleep % 60}분</div>` : ''}` : '';

  // 체력 게이지. 만족도 자리에는 숫자 대신 지금까지 찾아낸 좋은 조합 수만 둔다 —
  // 목표치를 띄우면 par 가 그대로 새어 나가고, 그러면 다시 계산 게임이 된다.
  const nPair = res.pairHit.length;
  $('#gauges').innerHTML = `${st ? `<div class="stam">
      <div class="bar"><i style="width:${Math.min(100, Math.max(0, st.low) / st.cap * 100)}%" class="${st.low < 0 ? 'out' : st.low < st.cap * .25 ? 'low' : ''}"></i></div>
      <span class="s" title="${esc(T.desc)}">${ic(T.ico)} 체력 ${Math.round(st.cap)} → 최저 ${Math.round(st.low)}${st.cap < res.full ? ` · 한계 ${res.full}에서 -${Math.round(res.full - st.cap)}` : ''}</span>
    </div>` : ''}
    <div class="stam">
      <div class="bar"><i class="joy${nPair >= 5 ? ' done' : ''}" style="width:${Math.min(100, nPair * 20)}%"></i></div>
      <span class="s" title="이어서 붙이면 손님이 특히 좋아하는 조합입니다">${ic('smile')} 좋은 조합 ${nPair}개${nPair ? ` — ${esc(res.pairHit.map(h => poi(h.pair.a).name + '·' + poi(h.pair.b).name).join(', '))}` : ''}</span>
    </div>`;

  let html = '';
  for (let d = S.day; d === S.day; d++) {
    const rows = res.rows.filter(r => r.day === d);
    // 하루가 시작되는 시각 — 1일차는 부산 도착 시각, 이후는 아침. compute() 와 같아야 한다.
    const t0 = d === 0 ? wakeOf(0) : d * 1440 + wakeOf(d);
    // 1일차는 집에서 출발하는 시각까지 거슬러 올라가 그린다
    const top = (d === 0 && arr) ? t0 - arr.min : t0;
    const t1 = (d + 1) * 1440 + 300;              // 다음날 새벽 5시까지 항상 그린다
    const y = t => (t - top) * PPM;
    const last = rows.length ? Math.max(...rows.map(r => r.end)) : t0;

    html += `<div class="dayhd">${hhmm(top)} ~ ${hhmm(last)} · ${rows.length}곳</div>
      <div class="tl" style="height:${y(t1)}px">`;

    // 손님이 사는 곳에서 출발하는 것부터가 일정이다
    if (d === 0 && arr) html += blk('arrive', 0, arr.min, -1,
      `${ic(arr.ico)} ${esc(S.quest.from)} ${hhmm(arr.dep != null ? arr.dep : arr.arrive - arr.min)} 출발`,
      `${bk ? bk.no : arr.name} · ${won(arrivalCost(S))}`,
      `${S.quest.from} → ${startPoint(S).name} (${bk ? bk.no : arr.name}) ${hhmm(arr.arrive)} 도착`);
    if (!rows.length) html += `<div class="tlhint" style="top:${y(t0) + 16}px">지도에서 장소를 골라 이 날에 추가하세요</div>`;

    // 시각 눈금 (정시는 실선+라벨, 30분은 점선)
    for (let t = Math.ceil(top / 30) * 30; t <= t1; t += 30) {
      const on = t % 60 === 0, mn = t % 1440 === 0;
      html += `<div class="hr ${mn ? 'mn' : on ? '' : 'mid'}" style="top:${y(t)}px">${on ? `<b>${hhmm(t)}</b>` : ''}</div>`;
    }

    // 마지막 날에는 손님이 정한 귀가 마감선을 긋는다
    if (d === S.quest.days - 1 && S.quest.endBy) {
      const due = d * 1440 + S.quest.endBy;
      if (due >= top && due <= t1)
        html += `<div class="hr due" style="top:${y(due)}px"><b>${hhmm(S.quest.endBy)} 귀가 마감</b></div>`;
    }

    // 마지막 날 끝에 귀가 구간
    if (res.back && res.back.day === d) {
      const bk = res.back, bt = TRANSPORT[bk.mode];
      html += blk('arrive', y(bk.begin), bk.leg.min, -2,
        `${ic(bt.ico)} ${esc(bk.name)} 귀가`, `${bt.name} · ${bk.leg.min}분 · ${won(bk.leg.cost)}`,
        `${bk.name} ${hhmm(bk.end)} 도착`, 'data-delret="1"');
      // 그 뒤 집까지 가는 도시간 귀가편 (1일차 맨 위의 출발 구간과 짝)
      if (bk.home) html += blk('arrive', y(bk.end), bk.home.min, -3,
        `${ic(bk.home.ico)} ${esc(bk.home.name)} 도착`, `${bk.home.via} · ${bk.home.min}분`,
        `${bk.name} ${hhmm(bk.end)} 출발 → ${bk.home.name} ${hhmm(bk.end + bk.home.min)} 도착`);
    }
    rows.forEach(r => {
      const depart = r.arrive - r.leg.min;
      const t = TRANSPORT[r.mode];
      // 이동·대기는 왼쪽 트랙, 장소는 오른쪽 트랙 — 짧아도 서로 안 가린다
      html += blk('move lane' + (r.leg.rush ? ' rush' : ''), y(depart), r.leg.min, r.i,
        `${ic(t.ico)} ${r.leg.min}분`, '',
        `${t.name} ${r.leg.km.toFixed(1)}km · ${r.leg.min}분${r.leg.rush ? ` (정체 +${r.leg.min - r.leg.base}분)` : ''}${walkNote(r.leg)} · ${won(r.leg.cost)}`);
      if (r.wait > 0) html += blk('wait lane', y(r.arrive), r.wait, r.i, `${ic("hourglass")}${r.wait}분`, '',
        `영업 시작까지 대기 ${r.wait}분`);
      // 체류 (숙소는 길이가 0이라 취침 표시로 대체)
      const isStay = r.poi.type === 'stay';
      html += blk(r.poi.type + (r.errs.length ? ' err' : '') + (S.sel === r.i ? ' on' : '') + (justAdded && S.sel === r.i ? ' new' : ''),
        y(r.begin), isStay ? MINBLK / PPM : r.stay, r.i,
        `<span class="nm">${isStay ? ic('bed-double') + ' ' : ''}${esc(r.poi.name)}</span>`,
        isStay ? '취침 · 다음날 아침 출발' : `${hhmm(r.begin)}–${hhmm(r.end)} · ${r.stay}분`,
        `${r.poi.name} ${hhmm(r.begin)}–${hhmm(r.end)}`, `data-del="${r.i}"`);
    });
    html += `</div>`;
  }
  box.innerHTML = html;
  renderEdit(res);
}

// 블록 하나. 짧아도 최소 높이는 주되, 시간 비례가 원칙.
// del: 블록 안에 놓을 삭제 버튼의 data 속성(`data-del="3"` 등). 없으면 버튼도 없다.
function blk(cls, top, mins, i, line1, line2, tip, del) {
  const h = Math.max(MINBLK, mins * PPM);
  const two = h >= 32 && line2;
  return `<div class="blk ${cls}${del ? ' hasx' : ''}" data-sel="${i}" style="top:${top}px;height:${h}px" title="${esc(tip || '')}"
    >${line1}${two ? `<br><span class="tm">${line2}</span>` : ''}${
      del ? `<span class="bx" ${del} title="일정에서 빼기">${ic("x")}</span>` : ''}</div>`;
}

// 선택한 블록의 편집 스트립. 짧은 블록 안에는 컨트롤이 안 들어가서 따로 뺐다.
function renderEdit(res) {
  const r = S.sel >= 0 ? res.rows.find(x => x.i === S.sel) : null;
  $('#editpop').hidden = !r;
  if (!r) return;
  const opts = Object.entries(TRANSPORT).map(([k, t]) =>
    `<option value="${k}" ${r.mode === k ? 'selected' : ''}>${t.name}</option>`).join('');
  $('#edit').innerHTML = `<div class="row">
      <b>${esc(r.poi.name)}</b>
      <span class="time">${hhmm(r.begin)}–${hhmm(r.end)}</span>
      <span class="grow"></span>
      <span class="mv" data-up="${r.i}">${ic("chevron-up")}</span><span class="mv" data-down="${r.i}">${ic("chevron-down")}</span>
      <span class="x" data-del="${r.i}">${ic("x")}</span>
    </div>
    <div class="row" style="margin-top:5px">
      <select data-mode="${r.i}">${opts}</select>
      ${r.poi.type === 'stay' ? `<span class="s">${ic('bed-double')} 취침</span>`
        : `<span class="s">체류</span><input type="number" data-stay="${r.i}" value="${r.stay}" min="10" max="600" step="5"><span class="s">분</span>`}
      <span class="grow"></span><span class="s">${won(r.cost)}</span>
    </div>
    <div class="s" style="margin-top:4px">${ic(TRANSPORT[r.mode].ico)} ${r.leg.min}분${
      r.leg.rush ? ` <b style="color:var(--warn)">(정체 +${r.leg.min - r.leg.base}분)</b>` : ''}${
      r.leg.walkMin ? ` · ${ic('footprints')} 도보 ${r.leg.walkMin}분` : ''}${
      r.leg.waitMin ? ` · ${ic('hourglass')} 대기 ${r.leg.waitMin}분` : ''}</div>
    ${subwayLine(res, r)}${busLine(res, r)}`;
}

// 그 줄이 출발하는 지점. 첫 줄은 출발지, 나머지는 앞 장소.
function prevPoint(res, r) {
  const i = res.rows.indexOf(r);
  return i > 0 ? res.rows[i - 1].poi : startPoint(S);
}

// 버스를 골랐을 때 두 정류장을 다 지나는 노선 번호. 소요시간에는 안 쓰는 안내용 표시.
function busLine(res, r) {
  if (r.mode !== 'bus') return '';
  const prev = prevPoint(res, r);
  const SUB = REGIONS[S.region].subway;
  // 통합 경로가 있으면 버스+지하철 환승까지 그대로 낸다
  const tp = transitPath(prev, r.poi);
  if (tp) {
    const TL = (REGIONS[S.region].transit || {}).lines || {};
    const head = n => (TL[n] && TL[n].h) ? ` <span style="opacity:.6">${esc(TL[n].h)}분</span>` : '';
    const legHtml = tp.legs.map(l => {
      if (l.mode === 'subway') {
        const L = (SUB.lines || []).find(x => x.id === l.lines[0]);
        return `<b style="color:${L ? L.color : 'inherit'}">${esc(L ? L.name : l.lines[0] + '호선')}</b> ${esc(l.from)}역→${esc(l.to)}역`;
      }
      return `${ic('bus')} <b>${esc(l.lines.slice(0, 2).join('·') || '버스')}</b>${l.lines[0] ? head(l.lines[0]) : ''} ${esc(l.from)}→${esc(l.to)}`;
    }).join(' · ');
    return `<div class="s" style="margin-top:4px">${legHtml}
      <span style="opacity:.7">· ${tp.transfers ? `환승 ${tp.transfers}회` : '직통'} · 승차 ${tp.min}분<span style="opacity:.6">(실제 노선)</span></span>
    </div>`;
  }
  // transit 표가 장소 쌍 전부를 덮으므로 여기 오는 건 표에 없는 임의 좌표뿐이다.
  return '';
}

// 지하철을 골랐을 때만 실제 노선·환승을 덧붙인다. 소요시간에는 아직 안 쓰는 안내용 표시.
function subwayLine(res, r) {
  if (r.mode !== 'subway') return '';
  const p = subwayPath(prevPoint(res, r), r.poi);
  if (!p) return '';
  const far = Math.max(p.walkFrom, p.walkTo) > 2;      // 역에서 멀면 안내가 무의미하다
  return `<div class="s subway" style="margin-top:4px">
    ${p.legs.map(l => `<b style="color:${l.color}">${esc(l.name)}</b> ${esc(stName(l.from))}→${esc(stName(l.to))} <span style="opacity:.6">${l.min}분</span>`).join(' · ')}
    <span style="opacity:.7">· ${p.stops}정거장${p.transfers ? ` · 환승 ${p.transfers}회` : ' · 직통'}
      · 승차 ${p.min}분<span style="opacity:.6">(실제 노선)</span></span>
    ${far ? `<br><span style="color:var(--warn)">역에서 ${Math.max(p.walkFrom, p.walkTo).toFixed(1)}km — 실제로는 버스·택시 구간</span>` : ''}
  </div>`;
}

// 어디에 얼마를 썼는지. 일차별로 묶어 보여준다.
let billOpen = false;
function billRows(res) {
  const b = res.bills || [];
  if (!b.length) return '<div class="s">아직 지출이 없습니다.</div>';
  let out = '', day = null;
  b.slice().sort((x, y) => x.day - y.day).forEach(e => {
    if (e.day !== day) { day = e.day; out += `<div class="bday">${day + 1}일차</div>`; }
    out += `<div class="brow ${e.amt < 0 ? 'minus' : ''}">${ic(e.ico)}<span class="bnm">${esc(e.what)}</span>
      <b>${e.amt < 0 ? '-' : ''}${won(Math.abs(e.amt))}</b></div>`;
  });
  return out;
}

// 획득한 버프 목록. 의뢰가 진행 중이면 이번 판에 남은 횟수도 함께 보여준다.
function renderBuffPop() {
  const left = S.quest ? computeS().left : null;   // render() 안에서 불린다
  const list = S.buffs.filter(b => BUFFS[b]);
  $('#buffpop').innerHTML = `<div class="row" style="margin-bottom:4px">
      <b style="font-size:13.5px">${ic('sparkles')} 획득한 버프 ${list.length}</b>
      <span class="grow"></span><span class="x" data-act="closebuff">${ic('x')}</span>
    </div>
    ${list.map(b => {
      const B = BUFFS[b], rest = left ? left[b] : B.uses;
      return `<div class="brow2">
        <span class="bic">${ic(B.ico)}</span>
        <span style="flex:1;min-width:0">
          <span class="bt">${esc(B.name)}</span>
          <div class="bd">${esc(B.desc)}</div>
        </span>
        <span class="buse ${rest ? '' : 'gone'}">${S.quest ? `${rest}/${B.uses}` : `${B.uses}`}${esc(B.unit)}</span>
      </div>`;
    }).join('')}
    <div class="s" style="margin-top:6px">${S.quest ? '남은 횟수 / 한 판 한도 — 일정 앞에서부터 순서대로 쓰입니다.' : '한 의뢰에서 쓸 수 있는 횟수입니다.'}</div>`;
  // 버튼 아래에 붙이되 화면 밖으로 나가지 않게
  const r = $('#buffbtn').getBoundingClientRect(), p = $('#buffpop');
  p.hidden = false;
  p.style.left = Math.max(8, Math.min(innerWidth - p.offsetWidth - 8, r.left - 8)) + 'px';
  p.style.top = (r.bottom + 9) + 'px';
}

function renderSum(res) {
  const q = S.quest;
  if (!q) { $('#stats').innerHTML = `<div class="s">의뢰를 선택하면 예산·시간이 표시됩니다.</div>`; $('#sum').innerHTML = ''; $('#warns').innerHTML = ''; return; }
  const over = res.spend > q.budget;
  $('#stats').innerHTML = `
    <div class="stat"><span>총 경비 <span class="s">/ ${won(q.budget)}</span></span><b id="vSpend" class="${over ? 'over' : ''}" title="누르면 지출 내역"></b></div>
    <div id="bills" ${billOpen ? '' : 'hidden'}>${billRows(res)}</div>
    ${res.over ? `<div class="stat"><span class="s">예산 초과 감점</span><b class="over">-${won(res.over)}</b></div>` : ''}
    <div class="stat"><span>총 이동시간</span><b id="vMove"></b></div>`;
  // bad 는 성립 자체가 불가능한 일정이라 막고, warn 은 손님 기대에 못 미칠 뿐이라 제출을 허용한다 —
  // 위험을 알고도 내는 선택이 있어야 제출이 결정이 된다.
  $('#sum').innerHTML = `
    <button class="go${res.warn.length ? ' risky' : ''}" id="submit" ${res.bad.length || !S.plan.length ? 'disabled' : ''}>${
      !S.plan.length ? '일정을 먼저 짜세요'
      : res.bad.length ? `제출 불가 · ${esc(res.bad[0])}${res.bad.length > 1 ? ` 외 ${res.bad.length - 1}건` : ''}`
      : res.warn.length ? `이대로 제출 · 아쉬운 점 ${res.warn.length}건`
      : '의뢰 제출'}</button>`;
  countTo($('#vSpend'), 'spend', res.spend, won, true);
  countTo($('#vMove'), 'move', res.moveMin, m => `${Math.floor(m / 60)}시간 ${m % 60}분`, true);
  // 모든 조건을 막 채운 순간을 알린다
  const okNow = !res.bad.length && !res.warn.length && S.plan.length > 0;
  if (okNow && PREV.ok === false) { $('#submit').classList.add('ready'); say('fav'); }
  PREV.ok = okNow;

  // 미충족 조건은 의뢰 카드 바로 아래에 붙여야 무엇을 더 채워야 하는지 바로 보인다
  // 방금 채워진 조건은 바로 지우지 않고 초록으로 바꿔 한 번 더 그린 뒤 사라지게 한다.
  // 목록을 통째로 다시 그리는 구조라, 다음 render 에서 자연히 빠진다(타이머 불필요).
  // 같은 조건인지는 괄호 안 현재값을 뺀 부분으로 본다 — "관광지 3곳 이상 필요 (현재 1)" 은
  // 숫자만 바뀌어도 매번 다른 문자열이라, 그대로 비교하면 아직 미달인데 초록으로 번쩍인다.
  const wkey = m => m.replace(/\s*\([^)]*\)\s*$/, '');
  const all = res.bad.concat(res.warn);
  const now = all.slice(0, 7), keys = now.map(wkey);
  const done = (PREV.warns || []).filter(m => !keys.includes(wkey(m)));
  PREV.warns = now;
  $('#warns').innerHTML = !S.plan.length && !all.length && !done.length ? '' : `<div class="card warns">
    <ul class="msgs">${now.map(m => `<li>${ic("triangle-alert")} ${esc(m)}</li>`).join('')
      + done.map(m => `<li class="done">${ic('check')} ${esc(wkey(m))}</li>`).join('')
      + (all.length ? '' : `<li class="ok">${ic('check')} 모든 조건 충족 — 제출 가능</li>`)}</ul></div>`;
}

// ─────────────────────────────────────────────────────────────
// 이벤트 (위임)
// ─────────────────────────────────────────────────────────────
// 방금 담긴(선택된) 블록이 타임라인 가운데로 오도록 스크롤한다.
// 타임라인은 하루가 다음날 05시까지라 길어서, 안 옮기면 추가된 게 화면 밖에 있기 쉽다.
function scrollToSel() {
  const box = $('#plan'), el = box.querySelector('.blk.on');
  if (!el) return;
  const r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
  box.scrollTop = Math.max(0, box.scrollTop + (r.top - b.top) - (box.clientHeight - r.height) / 2);
}

// 지금 보고 있는 일차의 끝 위치. 하루는 숙소에서 끝나므로 d번째 숙소 앞에 넣는다.
function insertAtDay(d) {
  let seen = 0;
  for (let i = 0; i < S.plan.length; i++) {
    if (poi(S.plan[i].id).type === 'stay') { if (seen === d) return i; seen++; }
  }
  return S.plan.length;
}

// 클릭할 때마다 추가 (같은 호텔 연박, 시장 재방문 등이 필요하므로 토글이 아님). 제거는 일정표의 × 버튼.
function addPoi(id, mode) {
  const p = poi(id);
  if (!S.quest || whyBlocked(p)) return;
  const i = insertAtDay(S.day);      // 보고 있는 일차에 들어간다
  S.plan.splice(i, 0, { id, mode: mode || S.defMode || 'bus', stay: p.stay });
  // 체력이 바닥나는 일정은 담지 않는다. whyBlocked 는 "가장 덜 지치는 수단" 으로만 보므로
  // 수단이 정해진 지금이 정확한 판정 지점이다 — 열 시간 걷는 구간이 여기서 걸린다.
  if (compute(S).dayStat.some(s => s.low < 0)) { S.plan.splice(i, 1); say('tired'); return; }
  S.sel = i;                         // 방금 넣은 걸 바로 편집할 수 있게
  if (isMobile() && sheetAt === 2) setSheet(1);   // 담으면 시트를 반쯤 올려 결과를 보여준다
  justAdded = true;
  render();                    // 팝업은 열린 채로 갱신된다 (연박·재방문을 이어서 누를 수 있게)
  justAdded = false;
  scrollToSel();
  // 조합이 성립했으면 그 말을 먼저 한다 — 규칙은 숨겨 두고 성립한 순간만 알려 준다.
  // 중간에 끼워 넣으면 뒤쪽과도 짝이 될 수 있어 i, i+1 둘 다 본다.
  const res2 = compute(S);
  const hit = res2.pairHit.find(h => h.i === i || h.i === i + 1);
  if (hit) say('fav', hit.pair.say); else say(reactTo(p, res2));
  flyUp(id, `${i + 1}번째 일정`);
}

document.addEventListener('click', ev => {
  if (dragged) { dragged = false; return; }   // 지도를 끌고 놓은 것은 클릭이 아니다

  // 버튼 안에 아이콘(<svg>)이 있으면 클릭 대상은 그 자식이 된다.
  // 그래서 데이터 속성은 반드시 closest() 로 거슬러 올라가 찾는다.
  const near = sel => ev.target.closest(sel);

  // 버프 팝오버는 자기 자신·여는 버튼 밖을 누르면 무조건 닫는다.
  // 아래 분기들이 대부분 return 으로 끝나므로 맨 앞에 둬야 걸린다.
  if (!$('#buffpop').hidden && !near('#buffpop') && !near('#buffbtn')) $('#buffpop').hidden = true;

  const fold = near('[data-fold]');
  if (fold) {
    // 폰에서는 같은 손잡이가 시트 높이를 맡는다 — 위 pointerup 이 이미 처리했다
    if (fold.dataset.sheetdrag) { delete fold.dataset.sheetdrag; return; }
    if (isMobile()) return;
    const p = $('#' + fold.dataset.fold), off = p.classList.toggle('hide');
    fold.innerHTML = ic('chevron-' + (p.classList.contains('left') ? (off ? 'right' : 'left') : (off ? 'left' : 'right')));
    return;
  }
  // 폰의 상단 요약 바: 아무 데나 누르면 펼쳤다 접는다 (버튼·탭 누름은 그대로 통과)
  if (isMobile() && near('.hud') && !near('button') && !near('[data-poi]')) {
    document.body.classList.toggle('hudopen');
    return;
  }

  const bf = near('[data-buff]');
  if (bf) { S.buffs.push(bf.dataset.buff); pendingPick = false; save(); $('#buff').close(); render(); return; }

  // 수단을 고르면 그 회사 예매 화면으로 넘어간다 — 시간대는 거기서 정한다
  const tr = near('[data-trip]');
  if (tr) { S.arriveId = tr.dataset.trip; S.depMin = null; $('#trip').close(); openBook(); return; }
  const sl = near('[data-slot]');
  if (sl) { bookSlot = +sl.dataset.slot; renderBook(); return; }
  const bk = near('[data-book]');
  if (bk) { S.depMin = +bk.dataset.book; $('#book').close(); render(); openRent(); return; }
  const rc = near('[data-rent]');
  if (rc) { S.defMode = rc.dataset.rent === 'yes' ? 'car' : 'bus'; $('#rentcar').close(); render(); return; }

  const q = near('[data-quest]');
  if (q) {
    const quest = REGIONS[S.region].quests.find(x => x.id === q.dataset.quest);
    if (quest.lv <= level()) {
      S.quest = quest; S.plan = []; S.sel = null; S.day = 0; S.arriveId = null; S.depMin = null; S.ret = null; S.wake = {}; S.pop = null; S.defMode = null;
      $('#pick').close(); render(); openLetter(quest);   // 편지를 닫으면 교통편 선택으로 이어진다
    }
    return;
  }

  const act = near('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'pick') $('#pick').showModal();
    else if (a === 'region') { renderRegions(); $('#region').showModal(); }
    else if (a === 'trip') openTrip();
    else if (a === 'book') openBook();
    else if (a === 'retrip') { $('#book').close(); openTrip(); }
    else if (a === 'closepop') closePoi();
    else if (a === 'closegu') { S.gu = null; render(); }
    else if (a === 'closebuff') $('#buffpop').hidden = true;
    return;
  }

  const rg = near('[data-region]');
  if (rg) { chooseRegion(rg.dataset.region); return; }

  const add = near('[data-add]');
  if (add) { openMove(add.dataset.add); return; }
  const mv = near('[data-move]');
  if (mv) { $('#move').close(); addPoi(mv.dataset.poi2, mv.dataset.move); return; }
  const rt = near('[data-ret]');
  if (rt) { S.ret = { mode: rt.dataset.ret }; $('#move').close(); render(); say('ok'); return; }

  const gu = near('[data-gu]');
  if (gu) { S.gu = S.gu === gu.dataset.gu ? null : gu.dataset.gu; render(); return; }

  const st = near('[data-start]');
  if (st) {
    if (!S.quest) return;
    // 마지막 날에 누르면 귀가 교통편, 그 외에는 올 때 교통편을 바꾼다
    if (S.plan.length && S.day === S.quest.days - 1) openReturn(); else openTrip();
    return;
  }

  const p = near('[data-poi]');
  // 목록에서 고른 경우 지도가 다시 그려지므로 그 뒤에 강조를 다시 입힌다
  if (p) { const id = p.dataset.poi; openPoi(id); hiId = null; highlight(id); return; }

  // 일정표 편집
  const del = near('[data-del]');
  if (del) { S.plan.splice(+del.dataset.del, 1); S.sel = null; render(); return; }
  // 귀가 교통편 취소. 블록은 두 개(부산 안 귀가 + 도시간 귀가편)지만 지우는 값은 하나다.
  const dret = near('[data-delret]');
  if (dret) { S.ret = null; render(); return; }
  const up = near('[data-up]');
  if (up) { const i = +up.dataset.up; if (i > 0) { [S.plan[i - 1], S.plan[i]] = [S.plan[i], S.plan[i - 1]]; S.sel = i - 1; render(); scrollToSel(); } return; }
  const dn = near('[data-down]');
  if (dn) { const i = +dn.dataset.down; if (i < S.plan.length - 1) { [S.plan[i + 1], S.plan[i]] = [S.plan[i], S.plan[i + 1]]; S.sel = i + 1; render(); scrollToSel(); } return; }
  const blk = near('[data-sel]');
  if (blk) { S.sel = +blk.dataset.sel; render(); return; }
  const rs = near('[data-reset]');
  if (rs) {
    const d = +rs.dataset.reset, R2 = REGIONS[S.region];
    const n = compute(S).rows.filter(r => r.day === d && r.poi.type !== 'stay').length;
    ask(`${d + 1}일차(${R2.dayNames[dowOf(S.quest, d)]})를 비울까요?`,
        `장소 ${n}곳이 지워집니다. 되돌릴 수 없어요. 그날을 마감하는 숙소는 남습니다.`,
        '비우기', () => resetDay(d));
    return;
  }

  const day = near('[data-day]');
  if (day) { S.day = +day.dataset.day; S.sel = null; render(); $('#plan').scrollTop = 0; return; }
  const tab = near('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; S.sub = null; render(); return; }   // 대분류를 바꾸면 세부 필터는 초기화
  const sub = near('[data-sub]');
  if (sub) { S.sub = sub.dataset.sub || null; render(); return; }
  if (near('#vSpend')) { billOpen = !billOpen; $('#bills').hidden = !billOpen; return; }
  if (near('#buffbtn')) {
    if ($('#buffpop').hidden) renderBuffPop(); else $('#buffpop').hidden = true;
    return;
  }
  if (near('#submit')) { submit(); return; }

  // 위 어디에도 안 걸렸고 팝업 바깥이면 팝업을 닫는다
  if (S.pop && !near('#poipop')) closePoi();
});

        : `<div class="rline"><span class="s">이어 붙이면 좋은 조합이 있었습니다</span><b class="s">0개</b></div>`}

    <div class="rlv" id="rlv" ${up ? '' : 'hidden'}>${ic("party-popper")} 레벨 ${level()} 달성 — 새 의뢰 해금!</div>
    <div class="rbtns" id="rbtns">
      <button class="go" id="rnext">다음 의뢰 고르기</button>

  $('#rstay').onclick = () => { $('#result').close(); render(); offerBuff(); };

// 결과 연출. 순서대로 하나씩 켜고, 창을 닫으면 남은 타이머를 버린다.
// 모션을 줄이는 설정이면 전부 즉시 최종 상태로 놓는다.
let rTimers = [];
function playResult(o) {
  rTimers.forEach(clearTimeout); rTimers = [];
  const quick = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const at = (ms, fn) => rTimers.push(setTimeout(fn, quick ? 0 : ms));
  const pct = (a, b) => Math.max(0, Math.min(100, a / b * 100));
  const xpPct = x => (x % 120) / 120 * 100;

  let t = 120;
  at(t, () => {                                        // ① 점수 게이지 + 숫자 카운트
    $('#rscf').style.width = pct(o.score, o.full) + '%';
    const el = $('#rscn'), t0 = performance.now();
    el.textContent = o.score;                        // 프레임이 안 돌아도 숫자는 맞게 (countTo 와 같은 규칙)
    const step = now => {
      const k = quick ? 1 : Math.min(1, (now - t0) / 850);
      el.textContent = Math.round(o.score * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
  t += 950;
  document.querySelectorAll('#result .stars .ic').forEach((el, i) => {   // ② 별 하나씩
    at(t + i * 250, () => { el.classList.add('in'); if (i < o.st) say('fav'); });
  });
  t += 250 * 3 + 120;
  document.querySelectorAll('#result .rline').forEach((el, i) =>         // ③ 경비·이동·만족도
    at(t + i * 190, () => el.classList.add('in')));
  t += 190 * 3 + 120;
  at(t, () => {                                                          // ④ 경험치 게이지
    $('#rxpf').style.width = (o.up ? 100 : xpPct(o.xpBefore + o.gained)) + '%';
  });
  if (o.up) {                                          // 레벨업이면 한 번 채웠다 비우고 다시 채운다
    t += 900;
    at(t, () => { const b = $('#rxpf'); b.style.transition = 'none'; b.style.width = '0'; });
    at(t + 60, () => { const b = $('#rxpf'); b.style.transition = ''; b.style.width = xpPct(S.xp) + '%'; });
    t += 700;
    at(t, () => { $('#rlv').classList.add('in'); say('fav'); });
  }
  t += 500;
  at(t, () => $('#rbtns').classList.add('in'));         // ⑥ 다 끝나면 버튼
}

// ── 지도 조작: 드래그 이동 / 휠 확대 ──────────────────────────
let drag = null, dragged = false;
const wrap = $('#mapwrap');

// 마우스·터치·펜을 한 코드로 받는다(pointer 이벤트). 손가락 두 개면 핀치 확대.
const touches = new Map();          // 눌려 있는 포인터들
let pinch = null;                   // { d: 두 점 거리, k: 시작 배율 }

const pinchInfo = () => {
  const [a, b] = [...touches.values()];
  const r = wrap.getBoundingClientRect();
  return { d: Math.hypot(a.x - b.x, a.y - b.y),
           cx: (a.x + b.x) / 2 - r.left, cy: (a.y + b.y) / 2 - r.top };
};

wrap.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2) { drag = null; pinch = { ...pinchInfo(), k: V.k }; dragged = true; return; }
  if (touches.size > 2) return;
  drag = { x: e.clientX, y: e.clientY, tx: V.tx, ty: V.ty };
  dragged = false;
  wrap.classList.add('grabbing');
});
window.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && touches.size === 2) {                      // 두 손가락 사이 거리 비율로 확대
    const now = pinchInfo();
    zoomTo(pinch.k * (now.d / pinch.d), now.cx, now.cy);
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4 && !dragged) { dragged = true; closePoi(); }
  V.tx = drag.tx + dx; V.ty = drag.ty + dy; V.auto = false;
  applyView();                                            // 이동은 재렌더 없이 transform 만
});
const endPointer = e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
  if (!touches.size) { drag = null; wrap.classList.remove('grabbing'); }
};
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const r = wrap.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

// ── 바텀시트 (폰 세로에서만) ─────────────────────────────────
// 데스크톱에서는 오른쪽 패널이라 아무것도 하지 않는다. 높이 3단계를 손잡이로 오간다.
const sheetEl = $('#pright');
// translateY 값 — 0에 가까울수록 많이 열린다. [열림, 반, 접힘]
const snaps = () => [innerHeight * .04, innerHeight * .46, innerHeight * .88 - 92];
let sheetAt = 2;
function setSheet(i) {
  sheetAt = Math.max(0, Math.min(2, i));
  const v = snaps()[sheetAt];
  sheetEl.style.setProperty('--sheet', v + 'px');
  // 화면에 드러난 시트 높이. 토스트·장소 팝업이 시트를 피해 앉도록 알려준다.
  // (시트는 높이 88vh 를 v 만큼 아래로 민 것이라, 보이는 높이는 88vh − v 다.)
  document.body.style.setProperty('--sheet-h', Math.max(0, innerHeight * .88 - v) + 'px');
}
{
  const handle = sheetEl.querySelector('.fold');
  let st = null;
  handle.addEventListener('pointerdown', e => {
    if (!isMobile()) return;
    st = { y: e.clientY, base: snaps()[sheetAt], moved: false };
    sheetEl.style.transition = 'none';
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if (!st) return;
    const v = Math.max(0, st.base + (e.clientY - st.y));
    if (Math.abs(e.clientY - st.y) > 4) st.moved = true;
    sheetEl.style.setProperty('--sheet', v + 'px');
  });
  handle.addEventListener('pointerup', e => {
    if (!st) return;
    sheetEl.style.transition = '';
    const cur = parseFloat(sheetEl.style.getPropertyValue('--sheet')) || 0;
    if (st.moved) {                       // 가장 가까운 단계로 붙인다
      let best = 0;
      snaps().forEach((s, i) => { if (Math.abs(s - cur) < Math.abs(snaps()[best] - cur)) best = i; });
      setSheet(best);
    } else setSheet(sheetAt === 2 ? 1 : sheetAt === 1 ? 0 : 2);   // 그냥 탭하면 단계 순환
    handle.dataset.sheetdrag = '1';        // 뒤따라 오는 click 을 무시시킨다
    st = null;
  });
  addEventListener('resize', () => { if (isMobile()) setSheet(sheetAt); });
  if (isMobile()) setSheet(2);
}

let pendingPick = false;
function offerBuff() {
  if (!pendingPick) return false;
  const left = Object.keys(BUFFS).filter(b => !S.buffs.includes(b));
  if (!left.length) { pendingPick = false; return false; }
  const two = [];
  while (two.length < Math.min(2, left.length)) {
    const c = left[Math.floor(Math.random() * left.length)];
    if (!two.includes(c)) two.push(c);
  }
  $('#buffopts').innerHTML = two.map(b => `<div class="card" data-buff="${b}">
      <div class="t">${ic(BUFFS[b].ico, 'big')} ${esc(BUFFS[b].name)}</div>
      <div class="s" style="margin-top:4px">${esc(BUFFS[b].desc)}</div>
    </div>`).join('');
  $('#buff').showModal();
  return true;
}
